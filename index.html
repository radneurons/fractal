<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGPU Fractal Explorer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: #fff; }
        canvas { display: block; }
        #gui-container { position: absolute; top: 10px; right: 10px; }
    </style>
</head>
<body>
    <canvas id="webgpu-canvas"></canvas>
    <div id="gui-container"></div>
    <script type="module">
        async function main() {
            const canvas = document.getElementById('webgpu-canvas');
            if (!canvas) {
                console.error("Canvas element not found!");
                alert("Canvas element not found!");
                return;
            }

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // Variables for buffers and layouts that might be needed in resize or elsewhere
            let fractalParamsBuffer, rayMarchParamsBuffer; // For render pipeline
            let renderPipeline, bindGroup; // For render pipeline
            let shipPhysicsParamsGPUBuffer, shipsBuffer; // For compute pipeline
            let computePipeline, computeBindGroup; // For compute pipeline
            let wormholesBuffer; // For wormhole data in render pipeline
            let presentationFormat = navigator.gpu.getPreferredCanvasFormat(); // Moved up for resize access if needed
            let shaderModule; // Will be created once and used by both pipelines
            const numShips = 10; // Number of ships for the simulation
            const MAX_WORMHOLES = 10; // Matches WGSL

            // Wormhole data
            const wormholeDataArray = new ArrayBuffer(MAX_WORMHOLES * 144);
            const wormholes = []; // JS array for easier management

            function getIdentity4x4() {
                const mat = new Float32Array(16);
                mat[0]=1; mat[5]=1; mat[10]=1; mat[15]=1;
                return mat;
            }

            const exampleWormhole1 = {
                is_active: 1,
                entry_pos_4d: { x: 0.8, y: 0.0, z: 0.0, w: 2.5 },
                exit_pos_4d:  { x: -0.8, y: 0.0, z: 0.0, w: 2.0 },
                radius: 0.25,
                transform_matrix: getIdentity4x4(), // Simple identity transform
                target_julia_c: { x: -0.745, y: 0.113, z: 0.0, w: 0.0 } // Example "Seahorse Valley" like
            };
            wormholes.push(exampleWormhole1);

            // Example of a second, inactive wormhole
            const exampleWormhole2 = {
                is_active: 0, // Inactive
                entry_pos_4d: { x: 0.0, y: 0.8, z: 0.0, w: 2.2 },
                exit_pos_4d:  { x: 0.0, y: -0.8, z: 0.0, w: 2.8 },
                radius: 0.15,
                transform_matrix: getIdentity4x4(),
                target_julia_c: { x: 0.285, y: 0.01, z: 0.0, w: 0.0 } // Example another Julia set
            };
            wormholes.push(exampleWormhole2);


            function updateWormholeBufferData(targetArrayBuffer, jsWormholesArray) {
                const view = new DataView(targetArrayBuffer);
                const stride = 144; // Bytes per wormhole
                for (let i = 0; i < MAX_WORMHOLES; ++i) {
                    const offset = i * stride;
                    if (i < jsWormholesArray.length && jsWormholesArray[i]) {
                        const wh = jsWormholesArray[i];
                        view.setUint32(offset + 0, wh.is_active, true); // is_active: u32 (offset 0)
                        // vec4<f32> entry_pos_4d starts at offset 16 (after 4 bytes for is_active + 12 bytes padding)
                        view.setFloat32(offset + 16, wh.entry_pos_4d.x, true);
                        view.setFloat32(offset + 20, wh.entry_pos_4d.y, true);
                        view.setFloat32(offset + 24, wh.entry_pos_4d.z, true);
                        view.setFloat32(offset + 28, wh.entry_pos_4d.w, true);
                        // vec4<f32> exit_pos_4d starts at offset 32
                        view.setFloat32(offset + 32, wh.exit_pos_4d.x, true);
                        view.setFloat32(offset + 36, wh.exit_pos_4d.y, true);
                        view.setFloat32(offset + 40, wh.exit_pos_4d.z, true);
                        view.setFloat32(offset + 44, wh.exit_pos_4d.w, true);
                        // f32 radius starts at offset 48
                        view.setFloat32(offset + 48, wh.radius, true);
                        // mat4x4<f32> transform_matrix starts at offset 64 (after 4 bytes for radius + 12 bytes padding)
                        // Stored column-major, 4 columns of vec4<f32>
                        for (let col = 0; col < 4; ++col) { // For each column
                            for (let row = 0; row < 4; ++row) { // For each element in the column
                                // JS matrix wh.transform_matrix is Float32Array(16) column-major
                                view.setFloat32(offset + 64 + (col * 16) + (row * 4), wh.transform_matrix[col * 4 + row], true);
                            }
                        }
                        // vec4<f32> target_julia_c starts at offset 128
                        view.setFloat32(offset + 128, wh.target_julia_c.x, true);
                        view.setFloat32(offset + 132, wh.target_julia_c.y, true);
                        view.setFloat32(offset + 136, wh.target_julia_c.z, true);
                        view.setFloat32(offset + 140, wh.target_julia_c.w, true);
                    } else {
                        // Mark as inactive if not enough JS wormholes defined or undefined entry
                        view.setUint32(offset + 0, 0, true); // is_active = 0
                        // Optionally zero out the rest of the struct for this slot
                    }
                }
            }
            updateWormholeBufferData(wormholeDataArray, wormholes); // Initial population

            // Function to prepare and write RayMarchParams
            // Needs device, buffer, canvasWidth, canvasHeight, and other params
            // For now, we'll define initial RayMarchParams and update canvas_size specifically
            const initialRayMarchParams = {
                camera_pos_4d: { x: 0, y: 0, z: 0, w: 3.0 },
                ray_transform_col0: { x: 1, y: 0, z: 0, w: 0 },
                ray_transform_col1: { x: 0, y: 1, z: 0, w: 0 },
                ray_transform_col2: { x: 0, y: 0, z: -1, w: 0 }, // Looking down -Z
                max_ray_steps: 50,
                min_hit_distance: 0.001,
                max_march_distance: 100.0,
            };

            function getRayMarchParamsArrayBuffer(width, height) {
                const data = new ArrayBuffer(96); // RayMarchParams size
                const view = new DataView(data);
                view.setFloat32(0, initialRayMarchParams.camera_pos_4d.x, true);
                view.setFloat32(4, initialRayMarchParams.camera_pos_4d.y, true);
                view.setFloat32(8, initialRayMarchParams.camera_pos_4d.z, true);
                view.setFloat32(12, initialRayMarchParams.camera_pos_4d.w, true);

                view.setFloat32(16, initialRayMarchParams.ray_transform_col0.x, true);
                view.setFloat32(20, initialRayMarchParams.ray_transform_col0.y, true);
                view.setFloat32(24, initialRayMarchParams.ray_transform_col0.z, true);
                view.setFloat32(28, initialRayMarchParams.ray_transform_col0.w, true);

                view.setFloat32(32, initialRayMarchParams.ray_transform_col1.x, true);
                view.setFloat32(36, initialRayMarchParams.ray_transform_col1.y, true);
                view.setFloat32(40, initialRayMarchParams.ray_transform_col1.z, true);
                view.setFloat32(44, initialRayMarchParams.ray_transform_col1.w, true);

                view.setFloat32(48, initialRayMarchParams.ray_transform_col2.x, true);
                view.setFloat32(52, initialRayMarchParams.ray_transform_col2.y, true);
                view.setFloat32(56, initialRayMarchParams.ray_transform_col2.z, true);
                view.setFloat32(60, initialRayMarchParams.ray_transform_col2.w, true);

                view.setFloat32(64, width, true);  // canvas_size.x
                view.setFloat32(68, height, true); // canvas_size.y
                // Padding for vec2 alignment (implicitly handled by next member if any, or struct size)
                
                view.setUint32(72, initialRayMarchParams.max_ray_steps, true);
                view.setFloat32(76, initialRayMarchParams.min_hit_distance, true);
                view.setFloat32(80, initialRayMarchParams.max_march_distance, true);
                // Bytes 84-95 are padding to 96
                return data;
            }


            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                
                console.log("Canvas resized to: " + canvas.width + "x" + canvas.height);
                
                if (device && context) { // Ensure device and context are available
                    context.configure({ // Reconfigure context with new size
                        device: device,
                        format: presentationFormat, // presentationFormat should be defined in main()
                        alphaMode: 'opaque',
                        // size: { width: canvas.width, height: canvas.height } // Optional: for explicit sizing
                    });
                    console.log("WebGPU context reconfigured for new size.");
                }

                if (device && rayMarchParamsBuffer) { // Update canvas_size in the buffer
                    const rayMarchData = getRayMarchParamsArrayBuffer(canvas.width, canvas.height);
                    device.queue.writeBuffer(rayMarchParamsBuffer, 0, rayMarchData);
                    console.log("RayMarchParamsBuffer updated with new canvas size.");
                }
                // No need to recreate pipeline or bind groups for simple canvas size change if shader handles it via uniform
            });

            if (!navigator.gpu) {
                console.error("WebGPU not supported on this browser.");
                alert("WebGPU not supported on this browser. Please use a browser that supports WebGPU.");
                return;
            }
            console.log("navigator.gpu found");

            const adapter = await navigator.gpu.requestAdapter();
            if (!adapter) {
                console.error("Failed to get GPU adapter.");
                alert("Failed to get GPU adapter.");
                return;
            }
            console.log("Adapter obtained:", adapter);

            const device = await adapter.requestDevice();
            if (!device) {
                console.error("Failed to get GPU device.");
                alert("Failed to get GPU device.");
                return;
            }
            console.log("Device obtained:", device);

            const context = canvas.getContext('webgpu');
            if (!context) {
                console.error("Failed to get WebGPU context from canvas.");
                alert("Failed to get WebGPU context from canvas.");
                return;
            }
            console.log("WebGPU context obtained:", context);

            // presentationFormat is now defined earlier
            context.configure({
                device: device,
                format: presentationFormat, // Use the stored presentationFormat
                alphaMode: 'opaque'
            });
            console.log("WebGPU context configured with format:", presentationFormat);

            // 1. Load Shader Code
            let shaderCode;
            try {
                const response = await fetch('fractal.wgsl');
                if (!response.ok) throw new Error(`Failed to fetch fractal.wgsl: ${response.statusText}`);
                shaderCode = await response.text();
                console.log("Shader code loaded successfully.");
            } catch (error) {
                console.error("Error loading shader code:", error);
                alert("Error loading shader code: " + error.message);
                return;
            }

            // 2. Create Shader Module
            // shaderModule is now declared in the outer scope
            try {
                shaderModule = device.createShaderModule({ code: shaderCode });
                console.log("Shader module created successfully.");
            } catch (error) {
                console.error("Error creating shader module:", error);
                alert("Error creating shader module: " + error.message);
                return;
            }

            // 3. Create Uniform Buffers (and Storage Buffers)

            // FractalParams Buffer (32 bytes) - For both render and compute
            const fractalParamsData = new ArrayBuffer(32);
            const fractalParamsView = new DataView(fractalParamsData);
            fractalParamsView.setFloat32(0, 0.3, true); // julia_c.x
            fractalParamsView.setFloat32(4, 0.6, true); // julia_c.y
            fractalParamsView.setFloat32(8, 0.0, true); // julia_c.z
            fractalParamsView.setFloat32(12, 0.0, true); // julia_c.w
            fractalParamsView.setUint32(16, 20, true);  // max_iterations
            fractalParamsView.setFloat32(20, 4.0, true); // escape_threshold
            fractalParamsView.setFloat32(24, 2.0, true); // power
            // Bytes 28-31 for padding

            try {
                fractalParamsBuffer = device.createBuffer({
                    size: fractalParamsData.byteLength,
                    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
                });
                device.queue.writeBuffer(fractalParamsBuffer, 0, fractalParamsData);
                console.log("FractalParams buffer created and data written.");
            } catch (error) {
                console.error("Error creating FractalParams buffer:", error);
                alert("Error creating FractalParams buffer: " + error.message);
                return;
            }
            
            // RayMarchParams Buffer (96 bytes) - For render pipeline
            const initialRayMarchData = getRayMarchParamsArrayBuffer(canvas.width, canvas.height);
            try {
                rayMarchParamsBuffer = device.createBuffer({
                    size: initialRayMarchData.byteLength,
                    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
                });
                device.queue.writeBuffer(rayMarchParamsBuffer, 0, initialRayMarchData);
                console.log("RayMarchParams buffer created and initial data written.");
            } catch (error) {
                console.error("Error creating RayMarchParams buffer:", error);
                alert("Error creating RayMarchParams buffer: " + error.message);
                return;
            }

            // Ship Physics related buffers (no change here)
            const shipPhysicsParams = { delta_time: 1/60, thrust_force: 5.0, max_speed: 0.5, damping_factor: 0.05, epsilon_gradient: 0.001 };
            const shipPhysicsParamsData = new ArrayBuffer(20); // 5 * f32
            const spView = new DataView(shipPhysicsParamsData);
            spView.setFloat32(0, shipPhysicsParams.delta_time, true);
            spView.setFloat32(4, shipPhysicsParams.thrust_force, true);
            spView.setFloat32(8, shipPhysicsParams.max_speed, true);
            spView.setFloat32(12, shipPhysicsParams.damping_factor, true);
            spView.setFloat32(16, shipPhysicsParams.epsilon_gradient, true);

            try {
                shipPhysicsParamsGPUBuffer = device.createBuffer({
                    size: shipPhysicsParamsData.byteLength,
                    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
                });
                device.queue.writeBuffer(shipPhysicsParamsGPUBuffer, 0, shipPhysicsParamsData);
                console.log("ShipPhysicsParams buffer created and data written.");
            } catch (error) {
                console.error("Error creating ShipPhysicsParams buffer:", error);
                alert("Error creating ShipPhysicsParams buffer: " + error.message);
                return;
            }

            // Ships Buffer (Storage)
            const shipStride = 3 * 4 * 4; // bytes per ship (pos vec4f, vel vec4f, acc vec4f)
            const initialShipData = new ArrayBuffer(numShips * shipStride);
            const shipDataView = new DataView(initialShipData);
            for (let i = 0; i < numShips; ++i) {
                const offset = i * shipStride;
                // Position (example: random in a small region around origin, w similar to camera)
                shipDataView.setFloat32(offset + 0, Math.random() * 1.0 - 0.5, true); // x
                shipDataView.setFloat32(offset + 4, Math.random() * 1.0 - 0.5, true); // y
                shipDataView.setFloat32(offset + 8, Math.random() * 1.0 - 0.5, true); // z
                shipDataView.setFloat32(offset + 12, 2.0 + Math.random() * 1.0, true);   // w
                // Velocity & Acceleration are initially zero (ArrayBuffer is zero-initialized)
            }
            try {
                shipsBuffer = device.createBuffer({
                    size: initialShipData.byteLength,
                    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST,
                });
                device.queue.writeBuffer(shipsBuffer, 0, initialShipData);
                console.log("Ships storage buffer created and initial data written.");
            } catch (error) {
                console.error("Error creating Ships storage buffer:", error);
                alert("Error creating Ships storage buffer: " + error.message);
                return;
            }

            // Wormholes Buffer (for render pipeline)
            try {
                wormholesBuffer = device.createBuffer({
                    size: wormholeDataArray.byteLength,
                    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
                });
                device.queue.writeBuffer(wormholesBuffer, 0, wormholeDataArray);
                console.log("Wormholes buffer created and initial data written.");
            } catch (error) {
                console.error("Error creating Wormholes buffer:", error);
                alert("Error creating Wormholes buffer: " + error.message);
                return;
            }

            // 4. Create Bind Group Layouts (Render and Compute)
            // renderBindGroupLayout needs to be recreated to include wormholes
            let renderBindGroupLayout;
            try {
                renderBindGroupLayout = device.createBindGroupLayout({ // For Render Pipeline
                    entries: [
                        { binding: 0, visibility: GPUShaderStage.FRAGMENT | GPUShaderStage.VERTEX, buffer: { type: 'uniform' } }, // FractalParams
                        { binding: 1, visibility: GPUShaderStage.FRAGMENT | GPUShaderStage.VERTEX, buffer: { type: 'uniform' } }, // RayMarchParams
                        { binding: 3, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } }, // Wormholes (only needed in fragment)
                    ],
                });
                console.log("Render bind group layout (with wormholes) created.");
            } catch (error) {
                console.error("Error creating render bind group layout (with wormholes):", error);
                alert("Error creating render bind group layout (with wormholes): " + error.message);
                return;
            }

            let computeBindGroupLayout; // Compute BGL remains unchanged
            try {
                computeBindGroupLayout = device.createBindGroupLayout({ // For Compute Pipeline
                    entries: [
                        { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'uniform' } }, // FractalParams
                        { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'uniform' } }, // ShipPhysicsParams
                        { binding: 2, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } }, // Ships
                    ],
                });
                console.log("Compute bind group layout created.");
            } catch (error) {
                console.error("Error creating compute bind group layout:", error);
                alert("Error creating compute bind group layout: " + error.message);
                return;
            }

            // 5. Create Pipeline Layouts (Render and Compute)
            let renderPipelineLayout; // Renamed from pipelineLayout
            try {
                renderPipelineLayout = device.createPipelineLayout({
                    bindGroupLayouts: [renderBindGroupLayout],
                });
                console.log("Render pipeline layout created.");
            } catch (error) {
                console.error("Error creating render pipeline layout:", error);
                alert("Error creating render pipeline layout: " + error.message);
                return;
            }

            let computePipelineLayout;
            try {
                computePipelineLayout = device.createPipelineLayout({
                    bindGroupLayouts: [computeBindGroupLayout],
                });
                console.log("Compute pipeline layout created.");
            } catch (error) {
                console.error("Error creating compute pipeline layout:", error);
                alert("Error creating compute pipeline layout: " + error.message);
                return;
            }
            
            // 6. Create Pipelines (Render and Compute)
            // Render Pipeline
            try {
                renderPipeline = device.createRenderPipeline({
                    layout: renderPipelineLayout,
                    vertex: {
                        module: shaderModule,
                        entryPoint: 'vs_main',
                    },
                    fragment: {
                        module: shaderModule,
                        entryPoint: 'fs_main',
                        targets: [{ format: presentationFormat }],
                    },
                    primitive: {
                        topology: 'triangle-list',
                    },
                });
                console.log("Render pipeline created.");
            } catch (error) {
                console.error("Error creating render pipeline:", error);
                alert("Error creating render pipeline: " + error.message);
                return;
            }

            // Compute Pipeline
            try {
                computePipeline = device.createComputePipeline({
                    layout: computePipelineLayout,
                    compute: {
                        module: shaderModule,
                        entryPoint: 'ship_physics_main',
                    },
                });
                console.log("Compute pipeline created.");
            } catch (error) {
                console.error("Error creating compute pipeline:", error);
                alert("Error creating compute pipeline: " + error.message);
                return;
            }

            // 7. Create Bind Groups (Render and Compute)
            // Render Bind Group (needs to be recreated)
            try {
                bindGroup = device.createBindGroup({ // For Render Pipeline
                    layout: renderPipeline.getBindGroupLayout(0), // Use layout from the newly created renderPipeline
                    entries: [
                        { binding: 0, resource: { buffer: fractalParamsBuffer } },
                        { binding: 1, resource: { buffer: rayMarchParamsBuffer } },
                        { binding: 3, resource: { buffer: wormholesBuffer } }, // Add wormholes buffer
                    ],
                });
                console.log("Render bind group (with wormholes) created.");
            } catch (error) {
                console.error("Error creating render bind group (with wormholes):", error);
                alert("Error creating render bind group (with wormholes): " + error.message);
                return;
            }

            // Compute Bind Group (remains unchanged)
            try {
                computeBindGroup = device.createBindGroup({ // For Compute Pipeline
                    layout: computePipeline.getBindGroupLayout(0), // Use layout from compute pipeline
                    entries: [
                        { binding: 0, resource: { buffer: fractalParamsBuffer } },
                        { binding: 1, resource: { buffer: shipPhysicsParamsGPUBuffer } },
                        { binding: 2, resource: { buffer: shipsBuffer } },
                    ],
                });
                console.log("Compute bind group created.");
            } catch (error) {
                console.error("Error creating compute bind group:", error);
                alert("Error creating compute bind group: " + error.message);
                return;
            }
            
            console.log("WebGPU Initialized Successfully and all resources created.");

            // 8. Render Loop (now includes Compute Pass)
            function frame() {
                if (!device || !context || !renderPipeline || !bindGroup || !computePipeline || !computeBindGroup) {
                    console.warn("Skipping frame: WebGPU resources not fully initialized.");
                    requestAnimationFrame(frame);
                    return;
                }
                
                // Update shipPhysicsParams.delta_time if using actual frame time (optional)
                // For now, it's constant 1/60.

                const commandEncoder = device.createCommandEncoder();

                // Compute Pass (Ship Physics)
                const computePassEncoder = commandEncoder.beginComputePass();
                computePassEncoder.setPipeline(computePipeline);
                computePassEncoder.setBindGroup(0, computeBindGroup);
                computePassEncoder.dispatchWorkgroups(Math.ceil(numShips / 64)); // Workgroup size is 64
                computePassEncoder.end();

                // Render Pass (Fractal)
                let textureView;
                try {
                    textureView = context.getCurrentTexture().createView();
                } catch(error) {
                    console.error("Failed to get current texture view. Device lost? Reconfiguring...", error);
                    // Attempt to reconfigure context, might help if device was lost temporarily
                    // or if canvas size changed causing issues not handled by simple configure.
                    // This is a simplified recovery attempt.
                    try {
                        context.configure({ 
                            device: device, 
                            format: presentationFormat, 
                            alphaMode: 'opaque' 
                        });
                        textureView = context.getCurrentTexture().createView();
                        console.log("Reconfigured context and got texture view.");
                    } catch (reconfigError) {
                        console.error("Failed to reconfigure context or get texture view after error:", reconfigError);
                        alert("Critical error in render loop. Please reload. (Texture view failure)");
                        // Stop the loop if we can't recover the texture view
                        return;
                    }
                }


                const renderPassEncoder = commandEncoder.beginRenderPass({
                    colorAttachments: [
                        {
                            view: textureView,
                            loadOp: 'clear',
                            clearValue: { r: 0.0, g: 0.0, b: 0.0, a: 1.0 },
                            storeOp: 'store',
                        },
                    ],
                });

                renderPassEncoder.setPipeline(renderPipeline);
                renderPassEncoder.setBindGroup(0, bindGroup);
                renderPassEncoder.draw(3, 1, 0, 0);
                renderPassEncoder.end();

                try {
                    device.queue.submit([commandEncoder.finish()]);
                } catch (error) {
                    console.error("Error submitting command buffer:", error);
                    // Potentially handle device loss here if not handled by texture view error
                }

                requestAnimationFrame(frame);
            }

            frame(); // Start the render loop
        }

        main().catch(err => {
            console.error("Error in main execution:", err);
            alert("An error occurred during WebGPU initialization or setup: " + err.message);
        });
    </script>
</body>
</html>
