  gl.uniform4fv(P.sh.u.uSW, swRects); gl.uniform4f(P.sh.u.uSWr, swr[0], swr[1], swr[2], 0);
  const drawGeo = (buf, count, prog, slab) => {
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 36, 0);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 36, 12);
    gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 3, gl.FLOAT, false, 36, 24);
    if (prog.u.uOff) gl.uniform3fv(prog.u.uOff, slabOff);
    if (prog.u.uSlab) gl.uniform1i(prog.u.uSlab, slab ? 1 : 0);
    gl.drawArrays(gl.TRIANGLES, 0, count);
  };
  drawGeo(BUF.tiers, GEO.tiers.length / 9, P.sh, false);
  if (rise > 0) drawGeo(BUF.slab, GEO.slab.length / 9, P.sh, true);
  // ── scene pass ──
  gl.bindFramebuffer(gl.FRAMEBUFFER, FBO); gl.viewport(0, 0, SW, SH);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  const common = (pr) => {
    gl.useProgram(pr.p);
    if (pr.u.uVP) gl.uniformMatrix4fv(pr.u.uVP, false, VP);
    gl.uniformMatrix4fv(pr.u.uLVP, false, LVP);
    gl.uniform3fv(pr.u.uSun, sun); gl.uniform3fv(pr.u.uSunCol, sunCol);
    if (pr.u.uCamPos) gl.uniform3fv(pr.u.uCamPos, cam.pos);
    if (pr.u.uT) gl.uniform1f(pr.u.uT, t);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, shTex); gl.uniform1i(pr.u.uShadow, 1);
  };
  // tiers
  common(P.tier);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, TEX.riser); gl.uniform1i(P.tier.u.uRA, 0);
  gl.uniform2f(P.tier.u.uRAS, RISER_ATLAS.w, RISER_ATLAS.h); gl.uniform1f(P.tier.u.uSpread, RISER_ATLAS.spread);
  const rows = new Float32Array(32); RISER_ATLAS.rows.forEach(r => rows.set([r.sStart, r.ppm, r.ay, r.hpx], r.k * 4));
  gl.uniform4fv(P.tier.u.uRow, rows);
  const RW = new Float32Array(128), RWs = new Float32Array(128);
  const RS = [...T.riser].sort((a, b) => a.tier - b.tier), TR = new Int32Array(16);
  RS.forEach((w, i) => { const start = w.id === 'stumbles_b' ? 6.62 : w.t - .32; RW.set([w.tier, w.s0, w.s1, revealOf(start, w.t, t)], i * 4); RWs.set([w.style, 0, 0, 0], i * 4); });
  for (let k = 1; k <= NT; k++) { const a = RS.findIndex(w => w.tier === k); const b = RS.filter(w => w.tier === k).length; TR.set(a < 0 ? [0, 0] : [a, a + b], k * 2); }
  gl.uniform2iv(P.tier.u.uTR, TR);
  gl.uniform4fv(P.tier.u.uRW, RW); gl.uniform4fv(P.tier.u.uRWs, RWs); gl.uniform1i(P.tier.u.uNRW, T.riser.length);
  drawGeo(BUF.tiers, GEO.tiers.length / 9, P.tier, false);
  // floor
  common(P.floor);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, TEX.floor); gl.uniform1i(P.floor.u.uFT, 0);
  gl.uniform1f(P.floor.u.uSpread, FLOOR_TEX.spread);
  gl.uniform4f(P.floor.u.uFRect, FLOOR.x0, FLOOR.z0, FLOOR.x1, FLOOR.z1);
  const FW = new Float32Array(96), FRv = new Float32Array(96);
  const matOf = id => ({ dust: 1, sweat: 2, blood: 3, face: 4 })[id] || 0;
  T.floorWords.forEach((w, i) => { FW.set([w.wx0, w.wz0, w.wx1, w.wz1], i * 4); FRv.set([revealOf(w.t - .35, w.t, t), matOf(w.id), 0, 0], i * 4); });
  gl.uniform4fv(P.floor.u.uFW, FW); gl.uniform4fv(P.floor.u.uFR, FRv); gl.uniform1i(P.floor.u.uNFW, T.floorWords.length);
  gl.uniform4f(P.floor.u.uMat, eIO(prog(t, 15.9, 16.9)), eIO(prog(t, 17.1, 18.1)), eIO(prog(t, 18.3, 19.7)), 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, BUF.floor); gl.disableVertexAttribArray(1); gl.disableVertexAttribArray(2);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 6);
  // slab
  if (rise > 0) {
    common(P.slab);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, TEX.slab); gl.uniform1i(P.slab.u.uST, 0);
    gl.uniform4fv(P.slab.u.uSW, swRects); gl.uniform4f(P.slab.u.uSWr, swr[0], swr[1], swr[2], 0);
    drawGeo(BUF.slab, GEO.slab.length / 9, P.slab, true);
  }
  // ── post: dust, sky, tone map ──
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, SW, SH); gl.disable(gl.DEPTH_TEST);
  common(P.post);
  gl.uniformMatrix4fv(P.post.u.uInvVP, false, M4.inv(VP));
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, colTex); gl.uniform1i(P.post.u.uCol, 0);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, depTex); gl.uniform1i(P.post.u.uDep, 2);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, TEX.attr); gl.uniform1i(P.post.u.uAttr, 3);
  const dust = .010 + .03 * eIO(prog(t, 11.0, 14.0)) - .022 * eIO(prog(t, 19.9, 20.5)) - .012 * eIO(prog(t, 22.4, 23.6));
  const exposure = eOut(prog(t, .4, 1.3));
  const fade = t >= 24.9 ? 1 : eIn(prog(t, 24.2, 24.9));
  gl.uniform4f(P.post.u.uDust, Math.max(dust, .012), eIO(prog(t, 11, 14)), exposure * .95, fade);
  gl.uniform1f(P.post.u.uAttrA, eOut(prog(t, 23.2, 23.9)));
  gl.bindBuffer(gl.ARRAY_BUFFER, BUF.quad); gl.disableVertexAttribArray(1); gl.disableVertexAttribArray(2);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// ───────────── playback & API ─────────────
let playing = true, t0 = null, tP = 0, ready = false;
const capture = new URLSearchParams(location.search).has('capture');
if (capture) document.body.classList.add('capture');
const pp = document.getElementById('pp'), scrub = document.getElementById('scrub'), tcEl = document.getElementById('tc');
function show(t) { scrub.value = String(Math.round(t * FPS) % NF); tcEl.textContent = t.toFixed(2) + ' s'; }
function seek(t) { if (!ready) return; playing = false; pp.textContent = 'Play'; tP = clamp(t, 0, DUR); render(tP); gl.finish(); show(tP); }
function tick(now) { if (playing && ready) { if (t0 === null) t0 = now - tP * 1000; const t = ((now - t0) / 1000) % DUR; render(t); show(t); tP = t; } requestAnimationFrame(tick); }
pp.onclick = () => { if (playing) { playing = false; pp.textContent = 'Play'; } else { playing = true; t0 = null; pp.textContent = 'Pause'; } };
scrub.oninput = () => seek(+scrub.value / FPS);
window.duration = DUR; window.fps = FPS; window.seek = seek; window.renderFrame = n => seek(clamp(Math.round(n), 0, NF) / FPS);
window.cues = [];
window.ready = (async () => {
  await loadFonts();
  buildText(); buildGeometry(); setupGL(); buildCamera();
  const all = [];
  RISER.forEach(R => R.words.forEach(w => all.push({ id: w[0], word: w[1], t: w[2] })));
  FLOORL.forEach(L => L.words.forEach(w => all.push({ id: w[0], word: w[1], t: w[2] })));
  SLABW.forEach(w => all.push({ id: w[0], word: w[1], t: w[2] }));
  const merged = all.filter(c => c.id !== 'stumbles_b').map(c => c.id === 'stumbles' ? { ...c, word: 'STUMBLES,' } : c).sort((a, b) => a.t - b.t);
  const ends = [3.6, 5.1, 8.2, 9.8, 11.4, 12.8, 14.4, 15.8, 20.2, 22.6];
  window.cues = merged.map(c => ({ id: c.id, word: c.word.replace(/[.,;]/g, '').toLowerCase(), start: +(c.t - .32).toFixed(3), t: c.t, end: ends.find(e => e > c.t + .3) || 24.2 }));
  window.debug = {
    floorWords: T.floorWords.map(w => ({ id: w.id, x0: w.wx0, x1: w.wx1, z0: w.wz0, z1: w.wz1 })),
    hashFrame: t => { seek(t); const px = new Uint8Array(SW * SH * 4); gl.readPixels(0, 0, SW, SH, gl.RGBA, gl.UNSIGNED_BYTE, px); let h = 2166136261; for (let i = 0; i < px.length; i += 7) { h ^= px[i]; h = Math.imul(h, 16777619); } return h >>> 0; },
    isBlack: t => { seek(t); const px = new Uint8Array(SW * SH * 4); gl.readPixels(0, 0, SW, SH, gl.RGBA, gl.UNSIGNED_BYTE, px); for (let i = 0; i < px.length; i += 4) if (px[i] | px[i + 1] | px[i + 2]) return false; return true; }
  };
  ready = true; window.__ready = true;
  if (capture) { playing = false; render(0); } else requestAnimationFrame(tick);
  return true;
})();
})();
</script>
