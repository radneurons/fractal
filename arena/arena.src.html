<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>In the Arena</title>
<style>
  html,body{margin:0;background:#0b0907;color:#d9cdb6;font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  #stage{position:relative;width:min(100vw,calc((100vh - 58px) * 16 / 9));aspect-ratio:16/9;margin:0 auto;background:#000}
  #c{display:block;width:100%;height:100%}
  #bar{display:flex;gap:12px;align-items:center;max-width:1100px;margin:0 auto;padding:12px 16px}
  #bar button{background:#231d17;color:#efe4cf;border:1px solid #43382c;border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
  #bar input[type=range]{flex:1}
  #tc{font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
  body.capture #bar{display:none}
  body.capture #stage{width:1920px;height:1080px;margin:0}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="bar">
  <button id="pp" type="button">Pause</button>
  <input id="scrub" type="range" min="0" max="1499" step="1" value="0" aria-label="Timeline">
  <span id="tc">0.00 s</span>
</div>
<script>const FONT_DATA = /*FONTDATA*/;</script>
<script>
(() => {
'use strict';
const SW = 1920, SH = 1080, FPS = 60, DUR = 25, NF = 1500, FR = 1 / FPS;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eIO = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eOut = p => 1 - Math.pow(1 - p, 3);
const eIn = p => p * p * p;
const DEG = Math.PI / 180;

// ───────────── world ─────────────
const A0 = 13, B0 = 9, TD = 1.4, TH = 1.5, NT = 6;    // floor ellipse, tier depth, tier height, tiers
const ellA = k => A0 + (k - 1) * TD, ellB = k => B0 + (k - 1) * TD;  // riser k sits on ellipse k
const FLOOR = { x0: -13, x1: 13, z0: -9, z1: 9, ppm: 104 };
const SLAB = { w: 9, h: 4.4, x: -3.4, z: 0, th: .28, ppm: 190 };   // faces east; the western sun shines through its cut letters toward the camera

// ───────────── locked text ─────────────
// critics: clause per tier riser (reads left→right as seen from inside the bowl)
// [id, text, landing t, readable end, style]  style: 0 normal, 1 deep (DOER), 2 faint (could have done them better)
const RISER = [
  { tier: 6, cap: .82, phi: -90, words: [['it', 'IT', .70], ['is1', 'IS', .82], ['not1', 'NOT', .95], ['the1', 'THE', 1.08], ['critic', 'CRITIC', 1.55], ['who1', 'WHO', 2.05], ['counts', 'COUNTS;', 2.50]] },
  { tier: 5, cap: .74, phi: -100, words: [['not2', 'NOT', 3.80], ['the2', 'THE', 3.92], ['man1', 'MAN', 4.10], ['who2', 'WHO', 4.32], ['points', 'POINTS', 4.60], ['out', 'OUT', 4.90]] },
  { tier: 4, cap: .66, phi: -110, words: [['how', 'HOW', 5.25], ['the3', 'THE', 5.38], ['strong', 'STRONG', 5.65], ['man2', 'MAN', 5.95], ['stumbles', 'STUM', 6.55]] },
  { tier: 3, cap: .60, phi: -120, words: [['stumbles_b', 'BLES,', 6.80], ['or', 'OR', 8.30], ['where', 'WHERE', 8.45], ['the4', 'THE', 8.60], ['doer', 'DOER', 8.95, 1], ['of', 'OF', 9.20], ['deeds', 'DEEDS', 9.45]] },
  { tier: 2, cap: .54, phi: -128, words: [['could', 'COULD', 9.95, 2], ['have', 'HAVE', 10.10, 2], ['done', 'DONE', 10.30, 2], ['them', 'THEM', 10.48, 2], ['better', 'BETTER.', 10.80, 2]] }
];
// doer: deep-cut floor lines. [id, text, t, capScale]
const FLOORL = [
  { z: -6.2, cap: .82, words: [['the5', 'THE', 11.55], ['credit', 'CREDIT', 11.85], ['belongs', 'BELONGS', 12.15], ['to', 'TO', 12.35], ['the6', 'THE', 12.45], ['man3', 'MAN', 12.65]] },
  { z: -4.95, cap: .82, words: [['who3', 'WHO', 12.95], ['is2', 'IS', 13.07], ['actually', 'ACTUALLY', 13.40, 1.3], ['in', 'IN', 13.65], ['the7', 'THE', 13.78]] },
  { z: -.55, cap: 3.7, words: [['arena', 'ARENA,', 14.25]] },
  { z: 2.35, cap: .82, words: [['whose', 'WHOSE', 14.65], ['face', 'FACE', 15.00, 2.3], ['is3', 'IS', 15.25], ['marred', 'MARRED', 15.55], ['by', 'BY', 15.75]] },
  { z: 4.75, cap: .72, words: [['dust', 'DUST', 16.20, 1.75], ['and1', 'AND', 17.00], ['sweat', 'SWEAT', 17.40, 1.75], ['and2', 'AND', 18.20], ['blood', 'BLOOD;', 18.60, 1.75]] }
];
const SLABW = [['who4', 'WHO', 20.35, .55], ['strives', 'STRIVES', 20.75, 1.25], ['valiantly', 'VALIANTLY;', 21.25, 1.25]];
const ATTR = ['THEODORE ROOSEVELT', '“CITIZENSHIP IN A REPUBLIC” · SORBONNE, PARIS · 23 APRIL 1910'];

// ───────────── fonts & distance fields ─────────────
const FAM = { thin: 'MontL', heavy: 'OswB', attr: 'MontSB' };
async function loadFonts() {
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)).buffer;
  const f = [new FontFace(FAM.thin, b(FONT_DATA['montserrat-300']), { weight: '300' }), new FontFace(FAM.heavy, b(FONT_DATA['oswald-700']), { weight: '700' }), new FontFace(FAM.attr, b(FONT_DATA['montserrat-600']), { weight: '600' })];

}
const fw = fam => fam === FAM.thin ? 300 : fam === FAM.heavy ? 700 : 600;
const mctx = document.createElement('canvas').getContext('2d');
function capR(fam) { mctx.font = `${fw(fam)} 200px "${fam}"`; return mctx.measureText('H').actualBoundingBoxAscent / 200; }
function edt1(f, n, d, v, z) {

  for (let q = 1; q < n; q++) { let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); while (s <= z[k]) { k--; s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); } k++; v[k] = q; z[k] = s; z[k + 1] = 1e20; }

}
function edt2(g, w, h) {
  const n = Math.max(w, h), f = new Float64Array(n), d = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1);
  for (let x = 0; x < w; x++) { for (let y = 0; y < h; y++) f[y] = g[y * w + x]; edt1(f, h, d, v, z); for (let y = 0; y < h; y++) g[y * w + x] = d[y]; }
  for (let y = 0; y < h; y++) { for (let x = 0; x < w; x++) f[x] = g[y * w + x]; edt1(f, w, d, v, z); for (let x = 0; x < w; x++) g[y * w + x] = d[x]; }
}
// draw(ctx) paints white glyphs; returns an R8 SDF (128 = edge, lower = inside) with spread px
function sdfCanvas(w, h, spread, draw) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const c = cv.getContext('2d'); c.fillStyle = '#fff'; draw(c);
  const img = c.getImageData(0, 0, w, h).data, N = w * h, a = new Float64Array(N), b = new Float64Array(N);
  for (let i = 0; i < N; i++) { const on = img[i * 4 + 3] > 127; a[i] = on ? 0 : 1e20; b[i] = on ? 1e20 : 0; }
  edt2(a, w, h); edt2(b, w, h);
  const out = new Uint8Array(N);
  for (let i = 0; i < N; i++) out[i] = Math.round(clamp(.5 + (Math.sqrt(a[i]) - Math.sqrt(b[i])) / (2 * spread)) * 255);
  return out;
}
function measure(fam, capPx, s) { mctx.font = `${fw(fam)} ${capPx / capR(fam)}px "${fam}"`; return mctx.measureText(s).width; }

// ───────────── layout of every text surface ─────────────
const T = { riser: [], floorWords: [], slabWords: [] };
let RISER_ATLAS, FLOOR_TEX, SLAB_TEX;
function arcTable(a, b) {   // cumulative arc length on ellipse from φ = -π
  const n = 2048, s = new Float64Array(n + 1); let acc = 0, px = a * Math.cos(-Math.PI), pz = b * Math.sin(-Math.PI);
  for (let i = 1; i <= n; i++) { const p = -Math.PI + i / n * 2 * Math.PI, x = a * Math.cos(p), z = b * Math.sin(p); acc += Math.hypot(x - px, z - pz); s[i] = acc; px = x; pz = z; }
  return { s, n, at: phi => { const f = (phi + Math.PI) / (2 * Math.PI) * n, i = Math.floor(f); return lerp(s[i], s[Math.min(n, i + 1)], f - i); } };
}
const ARC = {};
function buildText() {
  // risers
  const SP = 16, PX = 84;   // spread, cap px
  const rows = [];
  for (const R of RISER) {
    const k = R.tier, ar = arcTable(ellA(k), ellB(k)); ARC[k] = ar;
    const ppm = PX / R.cap, gap = .34 * R.cap;
    const ws = R.words.map(w => { const wd = measure(FAM.thin, PX, w[1]) / ppm; return { id: w[0], text: w[1], t: w[2], style: w[3] || 0, wd }; });
    const sCenter = ar.at(R.phi * DEG);
    let lead = [];
    if (k === 3) { const prev = T.riser.find(r => r.id === 'stumbles'); lead = ws.splice(0, 1); lead[0].s0 = ar.at(prev.phiEnd) + .08; lead[0].s1 = lead[0].s0 + lead[0].wd; lead[0].tier = k; T.riser.push(lead[0]); }
    let total2 = 0; ws.forEach((w, i) => { total2 += w.wd + (i ? gap : 0); });
    let s = sCenter - total2 / 2;
    ws.forEach((w, i) => { if (i) s += gap; w.s0 = s; w.s1 = s + w.wd; w.tier = k; s += w.wd; T.riser.push(w);
      if (w.id === 'stumbles') { let lo = -Math.PI, hi = Math.PI; for (let it = 0; it < 40; it++) { const m = (lo + hi) / 2; if (ar.at(m) < w.s1) lo = m; else hi = m; } w.phiEnd = lo; }
    });
    ws.unshift(...lead);
    const all = ws;
    const sStart = Math.min(...all.map(w => w.s0)) - 1.2;
    const sEnd = Math.max(...all.map(w => w.s1)) + 1.2;
    rows.push({ k, sStart, sEnd, ppm, cap: R.cap, ws, wpx: Math.ceil((sEnd - sStart) * ppm), hpx: Math.ceil(TH * ppm) });
  }
  // pack riser rows into one atlas
  const AW = 4096; let y = 0; rows.forEach(r => { r.ax = 0; r.ay = y; y += r.hpx + 2; });
  const AH = y; const atlas = new Uint8Array(AW * AH).fill(255);
  for (const r of rows) {
    const data = sdfCanvas(r.wpx, r.hpx, SP, c => {
      c.font = `300 ${PX / capR(FAM.thin)}px "${FAM.thin}"`;
      for (const w of r.ws) c.fillText(w.text, (w.s0 - r.sStart) * r.ppm, r.hpx * .74);
    });
    for (let rr = 0; rr < r.hpx; rr++) atlas.set(data.subarray(rr * r.wpx, (rr + 1) * r.wpx), (r.ay + rr) * AW + r.ax);
  }
  RISER_ATLAS = { data: atlas, w: AW, h: AH, rows, spread: SP };
  // floor (one field over the whole floor rectangle; text "up" points south, away from the north-side camera)
  const FW = Math.round((FLOOR.x1 - FLOOR.x0) * FLOOR.ppm), FH = Math.round((FLOOR.z1 - FLOOR.z0) * FLOOR.ppm), FSP = 20;
  const items = [];
  for (const L of FLOORL) {
    const ws = L.words.map(w => { const cap = L.cap * (w[3] || 1); return { id: w[0], text: w[1], t: w[2], cap, wd: measure(FAM.heavy, cap * FLOOR.ppm, w[1]) / FLOOR.ppm }; });
    const gap = L.cap * .42; let total = 0; ws.forEach((w, i) => { total += w.wd + (i ? gap : 0); });
    // text x runs west→east as seen from the north looking south: east is screen-left, so mirror x
    let x = -total / 2;
    ws.forEach((w, i) => { if (i) x += gap; w.x0 = x; w.x1 = x + w.wd; w.base = L.z; x += w.wd; items.push(w); });
  }
  T.floorWords = items;
  const fdata = sdfCanvas(FW, FH, FSP, c => {
    for (const w of items) { c.font = `700 ${w.cap * FLOOR.ppm / capR(FAM.heavy)}px "${FAM.heavy}"`; c.fillText(w.text, (w.x0 - FLOOR.x0) * FLOOR.ppm, (w.base - FLOOR.z0) * FLOOR.ppm); }
  });
  FLOOR_TEX = { data: fdata, w: FW, h: FH, spread: FSP };
  items.forEach(w => { w.wx0 = w.x0; w.wx1 = w.x1; w.wz0 = w.base - w.cap * 1.05; w.wz1 = w.base + .02; });
  // slab (front face seen from the north; reading direction = world -x again)
  const SWp = Math.round(SLAB.w * SLAB.ppm), SHp = Math.round(SLAB.h * SLAB.ppm), SSP = 18;
  const sw = SLABW.map(w => ({ id: w[0], text: w[1], t: w[2], cap: w[3] }));
  const lines = [[sw[0]], [sw[1]], [sw[2]]];
  const baseY = [3.95, 2.62, 1.08];   // metres from slab bottom
  lines.forEach((ln, li) => ln.forEach(w => { w.wd = measure(FAM.heavy, w.cap * SLAB.ppm, w.text) / SLAB.ppm; w.x0 = -SLAB.w / 2 + .55; w.base = baseY[li]; }));
  // centre the two big lines, keep WHO at the left
  sw[1].x0 = -sw[1].wd / 2; sw[2].x0 = -sw[2].wd / 2; sw[0].x0 = sw[2].x0;
  T.slabWords = sw;
  const sdata = sdfCanvas(SWp, SHp, SSP, c => {
    for (const w of sw) { c.font = `700 ${w.cap * SLAB.ppm / capR(FAM.heavy)}px "${FAM.heavy}"`; c.fillText(w.text, (w.x0 + SLAB.w / 2) * SLAB.ppm, (SLAB.h - w.base) * SLAB.ppm); }
  });
  SLAB_TEX = { data: sdata, w: SWp, h: SHp, spread: SSP };
}

// ───────────── matrices ─────────────
const M4 = {
  persp(fy, asp, n, f) { const t = 1 / Math.tan(fy / 2); return new Float32Array([t / asp, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) / (n - f), -1, 0, 0, 2 * f * n / (n - f), 0]); },
  ortho(l, r, b, t, n, f) { return new Float32Array([2 / (r - l), 0, 0, 0, 0, 2 / (t - b), 0, 0, 0, 0, -2 / (f - n), 0, -(r + l) / (r - l), -(t + b) / (t - b), -(f + n) / (f - n), 1]); },
  look(e, c, u) {
    let zx = e[0] - c[0], zy = e[1] - c[1], zz = e[2] - c[2]; let l = Math.hypot(zx, zy, zz); zx /= l; zy /= l; zz /= l;
    let xx = u[1] * zz - u[2] * zy, xy = u[2] * zx - u[0] * zz, xz = u[0] * zy - u[1] * zx; l = Math.hypot(xx, xy, xz); xx /= l; xy /= l; xz /= l;
    const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    return new Float32Array([xx, yx, zx, 0, xy, yy, zy, 0, xz, yz, zz, 0, -(xx * e[0] + xy * e[1] + xz * e[2]), -(yx * e[0] + yy * e[1] + yz * e[2]), -(zx * e[0] + zy * e[1] + zz * e[2]), 1]);
  },
  mul(a, b) { const o = new Float32Array(16); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + j] * b[i * 4 + k]; o[i * 4 + j] = s; } return o; },

// ───────────── geometry ─────────────
function buildGeometry() {
  // interleaved: pos3 nrm3 s v tier  (tier: k for riser k, 0 tread/wall, -2 slab)
  const V = [];
  const seg = 256;
  const pt = (a, b, p) => [a * Math.cos(p), b * Math.sin(p)];
  const nrm = (a, b, p) => { const x = Math.cos(p) / a, z = Math.sin(p) / b, l = Math.hypot(x, z); return [x / l, z / l]; };

        const a2 = ellA(k + 1), b2 = ellB(k + 1); const [X0, Z0] = pt(a2, b2, p0), [X1, Z1] = pt(a2, b2, p1);

        const a2 = a + .6, b2 = b + .6; const [X0, Z0] = pt(a2, b2, p0), [X1, Z1] = pt(a2, b2, p1);
        quad([x0, y1, z0, 0, 1, 0, 0, 0, 0], [X0, y1, Z0, 0, 1, 0, 0, 0, 0], [X1, y1, Z1, 0, 1, 0, 0, 0, 0], [x1, y1, z1, 0, 1, 0, 0, 0, 0]);
        const [G0x, G0z] = pt(a2 + 110, b2 + 110, p0), [G1x, G1z] = pt(a2 + 110, b2 + 110, p1), yg = y1 - .02;
