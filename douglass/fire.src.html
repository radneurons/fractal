<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Not Light, But Fire</title>
<style>
  html,body{margin:0;background:#050403;color:#cfc6b4;font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  #stage{position:relative;width:min(100vw,calc((100vh - 58px) * 16 / 9));aspect-ratio:16/9;margin:0 auto;background:#000}
  #c{display:block;width:100%;height:100%}
  #bar{display:flex;gap:12px;align-items:center;max-width:1100px;margin:0 auto;padding:12px 16px}
  #bar button{background:#1d1915;color:#efe6d2;border:1px solid #3a322a;border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
  #bar input[type=range]{flex:1}
  #tc{font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
  body.capture #bar{display:none}
  body.capture #stage{width:1920px;height:1080px;margin:0}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="bar">
  <button id="pp" type="button">Pause</button>
  <input id="scrub" type="range" min="0" max="1499" step="1" value="0" aria-label="Timeline">
  <span id="tc">0.00 s</span>
</div>
<script>const FONT_DATA = /*FONTDATA*/;</script>
<script>
(() => {
'use strict';
const SW = 1920, SH = 1080, FPS = 60, DUR = 25, NF = 1500, FR = 1 / FPS;
const WORLD = { w: 3840, h: 2160 };
const ACAP = 150;      // atlas cap height (px)
const SPREAD = 22;     // SDF half-range (atlas px)

// ── math ──
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eIO = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eOut = p => 1 - Math.pow(1 - p, 3);
const eIn = p => p * p * p;

// ── the locked text, one record per spoken word ──
// [id, text, style, landing t, readable end]
// styles: 0 serif connective, 1 LIGHT, 2 FIRE, 3 SHOWER-glass, 4 THUNDER, 5 STORM, 7 EARTHQUAKE, 8 WE NEED (heavy, fixed)
const SPEECH = [
  ['for', 'For', 0, 0.70, 5.4], ['it1', 'it', 0, 0.82, 5.4], ['is1', 'is', 0, 0.94, 5.4], ['not1', 'not', 0, 1.10, 5.4],
  ['light', 'LIGHT', 1, 2.00, 4.9],
  ['that', 'that', 0, 3.30, 5.4], ['is2', 'is', 0, 3.42, 5.4], ['needed', 'needed,', 0, 3.60, 5.4], ['but1', 'but', 0, 3.85, 5.4],
  ['fire', 'FIRE;', 2, 5.10, 6.4],
  ['it2', 'it', 0, 5.65, 8.6], ['is3', 'is', 0, 5.75, 8.6], ['not2', 'not', 0, 5.85, 8.6], ['the1', 'the', 0, 5.97, 8.6],
  ['gentle', 'GENTLE', 3, 7.00, 8.6], ['shower', 'SHOWER,', 3, 7.90, 8.6],
  ['but2', 'but', 0, 8.75, 11.0], ['thunder', 'THUNDER.', 4, 9.30, 11.0],
  ['we', 'We', 8, 11.20, 13.0], ['need', 'need', 8, 11.45, 13.0],
  ['the2', 'the', 0, 13.15, 15.6], ['storm', 'STORM,', 5, 14.30, 15.6],
  ['the3', 'the', 0, 15.75, 18.4], ['whirlwind', 'WHIRLWIND,', 6, 17.60, 18.4],
  ['and', 'and', 0, 18.55, 21.6], ['the4', 'the', 0, 18.70, 21.6], ['earthquake', 'EARTHQUAKE.', 7, 19.30, 21.6]
];
const ATTR = ['FREDERICK DOUGLASS', 'ROCHESTER, NEW YORK · 5 JULY 1852', 'FROM “WHAT TO THE SLAVE IS THE FOURTH OF JULY?”'];

// ── fonts (Canvas 2D is used only to rasterise glyphs at init) ──
const FAM = { serif: 'PlayfairD', cond: 'OswaldB' };
async function loadFonts() {
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)).buffer;
  const a = new FontFace(FAM.serif, b64(FONT_DATA['playfair-900']), { weight: '900' });
  const b = new FontFace(FAM.cond, b64(FONT_DATA['oswald-700']), { weight: '700' });
  await Promise.all([a.load(), b.load()]);
  document.fonts.add(a); document.fonts.add(b);
}
const mc = document.createElement('canvas').getContext('2d');
function fontCSS(fam, px) { return `${fam === FAM.serif ? 900 : 700} ${px}px "${fam}"`; }
function capRatio(fam) { mc.font = fontCSS(fam, 200); return mc.measureText('H').actualBoundingBoxAscent / 200; }

// exact Euclidean distance transform (Felzenszwalb & Huttenlocher)
function edt1(f, n, d, v, z) {
  let k = 0; v[0] = 0; z[0] = -1e20; z[1] = 1e20;
  for (let q = 1; q < n; q++) {
    let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
    while (s <= z[k]) { k--; s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
    k++; v[k] = q; z[k] = s; z[k + 1] = 1e20;
  }
  k = 0;
  for (let q = 0; q < n; q++) { while (z[k + 1] < q) k++; d[q] = (q - v[k]) * (q - v[k]) + f[v[k]]; }
}
function edt2(grid, w, h) {
  const n = Math.max(w, h), f = new Float64Array(n), d = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1);
  for (let x = 0; x < w; x++) { for (let y = 0; y < h; y++) f[y] = grid[y * w + x]; edt1(f, h, d, v, z); for (let y = 0; y < h; y++) grid[y * w + x] = d[y]; }
  for (let y = 0; y < h; y++) { for (let x = 0; x < w; x++) f[x] = grid[y * w + x]; edt1(f, w, d, v, z); for (let x = 0; x < w; x++) grid[y * w + x] = d[x]; }
}
// rasterise a string and return its signed distance field (Uint8, 128 = edge, lower = inside)
function makeSDF(text, fam, acap = ACAP) {
  const cr = capRatio(fam), px = acap / cr;
  mc.font = fontCSS(fam, px);
  const m = mc.measureText(text);
  const pad = SPREAD + 4;
  const asc = Math.ceil(Math.max(m.actualBoundingBoxAscent, acap)), desc = Math.ceil(Math.max(m.actualBoundingBoxDescent, acap * .28));
  const left = Math.ceil(m.actualBoundingBoxLeft);
  const w = Math.ceil(m.actualBoundingBoxRight + left) + pad * 2, h = asc + desc + pad * 2;
  const cv2 = document.createElement('canvas'); cv2.width = w; cv2.height = h;
  const c = cv2.getContext('2d');
  c.font = fontCSS(fam, px); c.fillStyle = '#fff'; c.fontKerning = 'normal';
  c.fillText(text, pad + left, pad + asc);
  const img = c.getImageData(0, 0, w, h).data;
  const N = w * h, inF = new Float64Array(N), outF = new Float64Array(N);
  for (let i = 0; i < N; i++) { const a = img[i * 4 + 3] / 255; inF[i] = a > .5 ? 0 : 1e20; outF[i] = a > .5 ? 1e20 : 0; }
  edt2(inF, w, h); edt2(outF, w, h);
  const out = new Uint8Array(N);
  for (let i = 0; i < N; i++) {
    const sd = Math.sqrt(inF[i]) - Math.sqrt(outF[i]);   // >0 outside, <0 inside
    out[i] = Math.round(clamp(.5 + sd / (2 * SPREAD)) * 255);
  }
  return { w, h, data: out, base: pad + asc, x0: pad + left, adv: m.width, acap };
}

// ── layout in world units ──
const WORDS = [];   // render records
let ATLAS = null, ATW = 4096, ATH = 0;
const WL = [];      // whirlwind letters
function build() {
  const crS = capRatio(FAM.serif), crC = capRatio(FAM.cond);
  const items = [];
  const add = (rec, x, y, cap) => {
    const fam = (rec.style === 0 || rec.style === 8 || rec.style === 9) ? FAM.serif : FAM.cond;
    const s = makeSDF(rec.text, fam, rec.style === 9 ? 60 : ACAP);
    const k = cap / s.acap;
    const it = { ...rec, sdf: s, k, cap, x, y, wx0: x - s.x0 * k, wy0: y - s.base * k, ww: s.w * k, wh: s.h * k, adv: s.adv * k };
    items.push(it);
    return it;
  };
  const R = {}; SPEECH.forEach((r, i) => { R[r[0]] = { id: r[0], text: r[1], style: r[2], t: r[3], end: r[4], idx: i + 1 }; });
  const sp = (cap) => cap * .3;
  const row = (ids, x, y, cap) => { let cx = x; const out = []; for (const id of ids) { const it = add(R[id], cx, y, cap); out.push(it); cx += it.adv + sp(cap); } return out; };
  // Band A
  const CAPL = 400, CAPS = 66;
  row(['for', 'it1', 'is1', 'not1'], 300, 300, CAPS);
  const L = add(R.light, 300, 800, CAPL);
  const fx = L.x + L.adv + 260;
  row(['that', 'is2', 'needed', 'but1'], fx, 300, CAPS);
  const F = add(R.fire, fx, 800, CAPL);
  // Band B
  row(['it2', 'is3', 'not2', 'the1'], 300, 1000, CAPS);
  const G = row(['gentle', 'shower'], 300, 1340, 250);
  const tx = G[1].x + G[1].adv + 200;
  add(R.but2, tx, 1000, CAPS);
  add(R.thunder, tx, 1340, 250);
  // Band C
  const we = add(R.we, 300, 1640, 120); add(R.need, 300 + we.adv + sp(120), 1640, 120);
  const t2 = add(R.the2, 1050, 1490 + CAPS, CAPS);
  add(R.storm, t2.x + t2.adv + sp(CAPS), 1700, 230);
  // whirlwind spiral centre
  WHIRL.cx = 2930; WHIRL.cy = 1770; WHIRL.R = 290;
  add(R.the3, WHIRL.cx - WHIRL.R - 250, WHIRL.cy - WHIRL.R * .45, CAPS);
  // Band D
  row(['and', 'the4'], 300, 1775, CAPS);
  add(R.earthquake, 300, 2055, 250);
  // attribution (not spoken)
  ATTR.forEach((s, i) => add({ id: 'attr' + i, text: s, style: 9, t: 22.4 + i * .12, end: 30 }, 2760, 400 + i * 50, i ? 24 : 40));
  // WHIRLWIND letters, one SDF each, set on a logarithmic spiral (clockwise, outer → inner)
  const letters = 'WHIRLWIND,'.split('');
  letters.forEach((ch, i) => { const s = makeSDF(ch, FAM.cond); WL.push({ ch, sdf: s, k: 112 / ACAP, cap: 112 }); });
  // pack atlas
  let x = 0, y = 0, rowH = 0;
  const all = [...items.map(i => i.sdf), ...WL.map(l => l.sdf)];
  for (const s of all) {
    if (x + s.w > ATW) { x = 0; y += rowH + 2; rowH = 0; }
    s.ax = x; s.ay = y; x += s.w + 2; rowH = Math.max(rowH, s.h);
  }
  ATH = y + rowH;
  ATLAS = new Uint8Array(ATW * ATH).fill(255);
  for (const s of all) for (let r = 0; r < s.h; r++) ATLAS.set(s.data.subarray(r * s.w, (r + 1) * s.w), (s.ay + r) * ATW + s.ax);
  for (const it of items) WORDS.push(it);
  // lookups
  WORDS.forEach(w => { BY[w.id] = w; });
  window.cues = SPEECH.map(r => ({ id: r[0], word: r[1].replace(/[.,;]/g, '').toLowerCase(), start: +(r[3] - ENTER({ style: r[2] })).toFixed(3), t: r[3], end: r[4] }));
}
const BY = {};
const WHIRL = {};
const ENTER = w => ({ 0: .12, 1: .7, 2: .7, 3: .9, 4: .02, 5: .9, 6: 1.4, 7: .2, 8: .3, 9: .4 })[w.style];

// ── GL ──
const gl = document.getElementById('c').getContext('webgl2', { preserveDrawingBuffer: true, antialias: false, premultipliedAlpha: false });
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
const FS = `#version 300 es
precision highp float;
uniform sampler2D uA;
uniform vec2 uAS;
uniform vec4 uCam;          // cx, cy, zoom, t
uniform int uN;
uniform vec4 uR[40];        // world rect x0,y0,x1,y1
uniform vec4 uU[40];        // atlas px rect x0,y0,x1,y1
uniform vec4 uS[40];        // style, reveal, k (world per atlas px), cap
uniform vec4 uB[40];        // baseline y, x0 (pen), extra, extra
uniform vec4 uWL[10];       // whirl letters: cx, cy, angle, alpha
uniform vec4 uWU[10];       // whirl letter atlas rect
uniform vec4 uLight;        // cx, cy, radius, amount
uniform vec4 uBurn;         // front, flameAmt, ashAmt, _
uniform vec4 uFire;         // form, gutter, scar, _
uniform vec4 uRain;         // amount, time, angleRad, freezeT
uniform vec4 uFill;         // gentle, shower, _, _
uniform vec4 uWave;         // cx, cy, radius, amp
uniform vec4 uWave2;        // echo radius1, amp1, radius2, amp2
uniform vec4 uWind;         // amount, stormForm, residual, _
uniform vec4 uVort;         // cx, cy, R, strength
uniform vec4 uQuake;        // progress(0..1 shake), lock(0..1), glow, _
uniform vec4 uPlates[8];    // seed x, seed y, final dx, final dy
uniform vec4 uPlateR[8];    // final rot, phase, _, _
uniform vec4 uEnd;          // erode, fade, white, _
uniform vec4 uUnder;        // underline rect x0,y,x1, alpha
uniform sampler2D uTile0, uTile1;   // up to 8 candidate words per 32×32 world tile
uniform vec2 uTileN;
uniform ivec4 uIdx;         // LIGHT, FIRE, GENTLE, SHOWER
out vec4 o;

const float SPREAD = ${SPREAD}.0;
float h11(float n){ return fract(sin(n*127.1)*43758.5453); }
float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),f.x), mix(h21(i+vec2(0,1)),h21(i+1.),f.x), f.y); }
float fbm(vec2 p){ float a=.5, s=0.; for(int i=0;i<5;i++){ s+=a*vnoise(p); p=p*2.03+vec2(17.,9.); a*=.5; } return s; }
float fbm3(vec2 p){ float a=.5, s=0.; for(int i=0;i<3;i++){ s+=a*vnoise(p); p=p*2.03+vec2(17.,9.); a*=.5; } return s; }
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }

float sdW(int i, vec2 p){
  vec4 r = uR[i];
  if (p.x < r.x || p.y < r.y || p.x > r.z || p.y > r.w) return SPREAD * uS[i].z;
  vec2 f = (p - r.xy) / (r.zw - r.xy);
  vec2 ap = mix(uU[i].xy, uU[i].zw, f);
  float v = texture(uA, ap / uAS).r;
  return (v - .5) * 2. * SPREAD * uS[i].z;
}
float sdL(int i, vec2 p){   // whirlwind letter
  vec4 L = uWL[i];
  vec2 q = rot(L.z) * (p - L.xy);
  vec4 u = uWU[i];
  float k = 112. / 150.;
  vec2 sz = (u.zw - u.xy) * k;
  vec2 f = q / sz + .5;
  if (f.x < 0. || f.y < 0. || f.x > 1. || f.y > 1.) return SPREAD * k;
  float v = texture(uA, mix(u.xy, u.zw, f) / uAS).r;
  return (v - .5) * 2. * SPREAD * k;
}
vec3 ramp(float h){
  vec3 a=vec3(.227,.039,.016), b=vec3(.62,.165,.043), c=vec3(.91,.38,.10), d=vec3(1.,.757,.37), e=vec3(1.,.957,.84);
  h = clamp(h,0.,1.);
  if (h < .25) return mix(vec3(0.), a, h/.25);
  if (h < .45) return mix(a, b, (h-.25)/.2);
  if (h < .65) return mix(b, c, (h-.45)/.2);
  if (h < .85) return mix(c, d, (h-.65)/.2);
  return mix(d, e, (h-.85)/.15);
}
float rainField(vec2 p, float tt, float ang, float density){
  vec2 r = rot(ang) * p;
  float colW = 11.;
  float ci = floor(r.x / colW);
  if (h11(ci) > density) return 0.;
  float speed = 1300. + 700.*h11(ci+3.1);
  float len = 70. + 90.*h11(ci+7.3);
  float period = 420. + 380.*h11(ci+5.7);
  float y = r.y - tt*speed - h11(ci+11.9)*4000.;
  float seg = mod(y, period);
  float streak = smoothstep(len, len*.2, seg) * smoothstep(0., 6., seg);
  float x = fract(r.x / colW) - .5 - (h11(ci+13.)-.5)*.5;
  return streak * smoothstep(.16, .0, abs(x));
}

void main(){
  vec2 s = vec2(gl_FragCoord.x, ${SH}.0 - gl_FragCoord.y);
  float z = uCam.z, t = uCam.w;
  vec2 p0 = uCam.xy + (s - vec2(${SW / 2}.0, ${SH / 2}.0)) / z;
  float aa = 1.0 / z;
  // ── domain warps (in order of the events) ──
  vec2 p = p0;
  // earthquake plates
  float faultGlow = 0.;
  if (uQuake.x > 0.) {
    float d1 = 1e9, d2 = 1e9; int id = 0;
    for (int i = 0; i < 8; i++) { float d = distance(p0, uPlates[i].xy); if (d < d1) { d2 = d1; d1 = d; id = i; } else if (d < d2) d2 = d; }
    vec4 P = uPlates[id]; vec4 PR = uPlateR[id];
    float sh = uQuake.x * (1. - uQuake.y);
    float wob = sin(t * 23. + PR.y) * 14. * sh + sin(t * 37. + PR.y * 2.) * 7. * sh;
    vec2 off = P.zw * uQuake.y + vec2(wob, wob * .6) * uQuake.x;
    float ang = PR.x * uQuake.y + sin(t * 19. + PR.y) * .004 * sh;
    p = P.xy + rot(-ang) * (p0 - P.xy) - off;
    faultGlow = smoothstep(9., 0., d2 - d1) * uQuake.z;
  }
  vec2 pq = p;   // after the plates, before the vortex (the spiral letters ride the vortex, they are not smeared by it)
  // whirlwind vortex
  if (uVort.w != 0.) {
    vec2 d = p - uVort.xy; float r = length(d);
    float a = uVort.w * (uVort.z * .4) / (r + uVort.z * .18) * smoothstep(uVort.z * 1.25, uVort.z * .1, r);
    p = uVort.xy + rot(a) * d;
  }
  // thunder: pressure wave and its echoes
  vec2 pw = p; float waveBright = 0.;
  {
    vec2 d = p - uWave.xy; float r = length(d) + 1e-3; vec2 n = d / r;
    for (int k = 0; k < 3; k++) {
      float R = k == 0 ? uWave.z : (k == 1 ? uWave2.x : uWave2.z);
      float A = k == 0 ? uWave.w : (k == 1 ? uWave2.y : uWave2.w);
      if (A <= 0.) continue;
      float x = (r - R) / 90.;
      float prof = x * exp(-x * x);
      pw -= n * A * prof;
      waveBright += A / 60. * exp(-x * x) * step(0., -x + 1.2);
    }
  }
  // ── background: soot with stationary ash variation ──
  vec3 col = mix(vec3(.043,.039,.035), vec3(.09,.078,.066), vnoise(p0 / 340.) * .7 + vnoise(p0 / 70.) * .25);

  // ── light shafts behind LIGHT ──
  int iL = uIdx.x, iG = uIdx.z;
  if (uLight.w > 0.) {
    vec2 c = uLight.xy; float R = uLight.z;
    float dist = length(pw - c);
    if (dist < R * 2.2) {
      float acc = 0.;
      float jit = h21(gl_FragCoord.xy) / 30.;   // deterministic per-pixel dither against banding
      for (int k = 0; k < 30; k++) {
        float f = float(k) / 30. + jit;
        vec2 q = mix(pw, c, f);
        vec2 dq = (q - c) / vec2(R * .8, R * .3);
        float src = exp(-dot(dq, dq));
        float cov = smoothstep(-2., 2., sdW(iL, q));   // 1 where open (not blocked by a letter)
        acc += src * cov * (1. - f * .5);
      }
      acc /= 30.;
      acc *= smoothstep(R * 2.2, R * 1.4, dist);
      col += vec3(.75,.84,.9) * acc * 1.6 * uLight.w;
      vec2 dg = (pw - c) / vec2(R * 1.3, R * .7);
      col += vec3(.75,.84,.9) * exp(-dot(dg, dg)) * .035 * uLight.w;
    }
  }

  // ── rain ──
  float rain = 0.;
  if (uRain.x > 0.) {
    vec2 pr = pw;
    if (uRain.w > 0.) { vec2 d = pr - uWave.xy; pr -= normalize(d + 1e-3) * uRain.w * 900.; }
    rain = rainField(pr, uRain.y, uRain.z, .55) * uRain.x;
    if (uRain.w > 0.) rain *= step(.5, fract(pr.y / 22.)) * (1. - clamp(uRain.w * 1.6, 0., 1.));
  }

  // ── words ──
  float wind = uWind.x;
  ivec2 tc = ivec2(clamp(floor(pw / 32.), vec2(0.), uTileN - 1.));
  vec4 ta = texelFetch(uTile0, tc, 0) * 255., tb = texelFetch(uTile1, tc, 0) * 255.;
  for (int kk = 0; kk < 8; kk++) {
    float fi = kk < 4 ? ta[kk] : tb[kk - 4];
    if (fi < .5) break;
    int i = int(fi + .5) - 1;
    vec4 S = uS[i]; int st = int(S.x); float rev = S.y; if (rev <= 0.) continue;
    if (st == 6) continue;
    vec4 R = uR[i]; float cap = S.w;
    vec2 q = (st == 8) ? p0 : pw;
    float m = cap * 1.2;
    if (q.x < R.x - m || q.y < R.y - m || q.x > R.z + m || q.y > R.w + m) continue;
    float d = sdW(i, q);
    // wind streaks (storm): ink smears downwind
    float wAmt = wind * (st == 5 ? 0. : .6) + (st == 5 ? uWind.z : 0.);
    float streak = 0.;
    if (wAmt > 0.) {
      float wsum = 0.;
      for (int k = 1; k < 9; k++) {
        float fk = float(k);
        float dk = sdW(i, q - vec2(fk * 11. * wAmt, sin(q.x * .013 + fk * .7) * 3. * wAmt));
        float wk = (1. - fk / 9.);
        streak += smoothstep(aa * 2., -aa * 2., dk) * wk; wsum += wk;
      }

  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(U.uA, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, TILES[0]); gl.uniform1i(U.uTile0, 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, TILES[1]); gl.uniform1i(U.uTile1, 2);
  gl.uniform4f(U.uCam, cam.cx, cam.cy, cam.z, t);
  const SS = new Float32Array(160);
  WORDS.forEach((w, i) => SS.set([w.style, S.reveal[i], w.k, w.cap], i * 4));
  gl.uniform4fv(U.uS, SS);
  gl.uniform4fv(U.uWL, S.wl);
  gl.uniform4fv(U.uLight, S.light); gl.uniform4fv(U.uBurn, S.burn); gl.uniform4fv(U.uFire, S.fire);
  gl.uniform4fv(U.uRain, S.rain); gl.uniform4fv(U.uFill, S.fill); gl.uniform4fv(U.uWave, S.wave); gl.uniform4fv(U.uWave2, S.wave2);
  gl.uniform4fv(U.uWind, S.wind); gl.uniform4fv(U.uVort, S.vort); gl.uniform4fv(U.uQuake, S.quake); gl.uniform4fv(U.uEnd, S.end); gl.uniform4fv(U.uUnder, S.under);
  gl.bindBuffer(gl.ARRAY_BUFFER, quad); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  if (S.sparkAmt > 0) {
    const F = BY.fire;
    gl.useProgram(progSp);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    gl.uniform4f(U.sp_uCam, cam.cx, cam.cy, cam.z, t);
    gl.uniform4f(U.sp_uBox, F.x, F.y - F.cap, F.x + F.adv, F.y);
    gl.uniform1f(U.sp_uAmt, S.sparkAmt);
    gl.bindBuffer(gl.ARRAY_BUFFER, sparkBuf); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 1, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.POINTS, 0, 160);
    gl.disable(gl.BLEND);
  }
}

// ── playback & API ──
let playing = true, t0 = null, tP = 0, ready = false;
const capture = new URLSearchParams(location.search).has('capture');
if (capture) document.body.classList.add('capture');
const pp = document.getElementById('pp'), scrub = document.getElementById('scrub'), tcEl = document.getElementById('tc');
function show(t) { scrub.value = String(Math.round(t * FPS) % NF); tcEl.textContent = t.toFixed(2) + ' s'; }
function seek(t) { if (!ready) return; playing = false; pp.textContent = 'Play'; tP = clamp(t, 0, DUR); render(tP); gl.finish(); show(tP); }
function tick(now) { if (playing && ready) { if (t0 === null) t0 = now - tP * 1000; const t = ((now - t0) / 1000) % DUR; render(t); show(t); tP = t; } requestAnimationFrame(tick); }
pp.onclick = () => { if (playing) { playing = false; pp.textContent = 'Play'; } else { playing = true; t0 = null; pp.textContent = 'Pause'; } };
scrub.oninput = () => seek(+scrub.value / FPS);
window.duration = DUR; window.fps = FPS; window.seek = seek; window.renderFrame = n => seek(clamp(Math.round(n), 0, NF) / FPS);
window.cues = [];
window.ready = (async () => {
  await loadFonts();
  build(); setupGL(); buildCamera();
  window.debug = {
    words: WORDS.map(w => ({ id: w.id, style: w.style, x: w.x, y: w.y, adv: w.adv, cap: w.cap })), tileOverflow: () => TILE_OVERFLOW,
    hashFrame: t => { seek(t); const px = new Uint8Array(SW * SH * 4); gl.readPixels(0, 0, SW, SH, gl.RGBA, gl.UNSIGNED_BYTE, px); let h = 2166136261; for (let i = 0; i < px.length; i += 7) { h ^= px[i]; h = Math.imul(h, 16777619); } return h >>> 0; },
    isBlack: t => { seek(t); const px = new Uint8Array(SW * SH * 4); gl.readPixels(0, 0, SW, SH, gl.RGBA, gl.UNSIGNED_BYTE, px); for (let i = 0; i < px.length; i += 4) if (px[i] | px[i + 1] | px[i + 2]) return false; return true; }
  };
  ready = true; window.__ready = true;
  if (capture) { playing = false; render(0); } else requestAnimationFrame(tick);
  return true;
})();
})();
</script>
