<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Because They Are Hard</title>
<style>

</style>
</head>

  K(3.70, fit(['moon'], .1, { dy: -40, zm: 1.02 }));
  K(4.55, fit(['moon', 'decade'], .06, { dy: 260, zm: 1.1 }));
  K(6.10, fit(['in', 'things'], .25, { dx: 260, dy: -30, zm: 1.0 }));
  K(6.55, fit(['not', 'easy', 'they1'], .14));
  K(7.70, fit(['not', 'easy'], .12, { zm: 1.0 }));
  K(8.40, fit(['easy', 'hard', 'because2'], .1));
  K(9.40, fit(['easy', 'hard'], .1, { zm: 1.01 }));
  K(9.75, fit(['because3', 'goal', 'serve'], .2));
  K(10.12, fit(['because3', 'goal', 'serve'], .2, { zm: 1.02 }));
  K(10.42, { cx: hard.x + 260, cy: hard.y + 60, z: .92, r: -6 * DEG });
  const con = fit(['to3', 'organize', 'best'], .08, { box: [vh.x - 760, RAIL - HV - 80, vh.x + 1150, RAIL + 60] });
  K(10.78, { ...con, r: 0 });
  K(12.10, { ...con, z: con.z * 1.02 });
  K(12.45, fit(['measure'], .06, { box: [vh.x - 160, RAIL - HV - 60, vh.x + 200, RAIL + 40], zm: .96 }));
  K(13.40, fit(['measure'], .06, { box: [vh.x - 160, RAIL - HV - 60, vh.x + 200, RAIL + 40], zm: .98 }));
  K(13.70, fit(['best', 'energies'], .08, { box: [vh.x - 100, RAIL - HV - 60, vh.x + 150, RAIL] }));
  K(14.95, fit(['energies', 'skills'], .1, { box: [vh.x - 200, RAIL - HV - 80, vh.x + 200, RAIL] }));
  K(15.80, fit(['energies', 'skills'], .1, { box: [vh.x - 200, RAIL - HV - 80, vh.x + 200, RAIL], zm: 1.01 }));
  K(16.65, fit(['challenge', 'because4'], .06, { box: [GATE.xl - 200, GATE.top - 40, CRADLE.x + 200, RAIL + 40] }));
  K(17.35, fit(['challenge'], .05, { box: [GATE.xl - 300, GATE.top - 40, CRADLE.x + 260, RAIL + 140], zm: 1.0 }));
  K(18.62, fit(['is', 'are3', 'accept'], .1, { box: [CRADLE.x - 150, RAIL - HV - 60, CRADLE.x + 200, RAIL + 30] }));
  K(19.60, fit(['willing', 'accept'], .1, { box: [CRADLE.x - 150, RAIL - HV - 30, CRADLE.x + 200, RAIL + 30] }));
  K(20.40, fit(['willing', 'unwilling'], .1, { box: [CRADLE.x - 150, RAIL - HV - 30, HOLD.x + 60, RAIL + 30] }));
  K(21.40, fit(['unwilling', 'postpone'], .1, { box: [CRADLE.x - 150, RAIL - HV - 30, HOLD.x + 60, RAIL + 30] }));
  K(22.55, fit(['unwilling', 'postpone'], .1, { box: [CRADLE.x - 150, RAIL - HV - 30, HOLD.x + 60, RAIL + 30], zm: 1.01 }));
  K(23.30, fit(['postpone', 'intend', 'and4'], .08, { box: [N.win.x - 80, RAIL - HV, R('win'), RAIL + 30] }));
  K(23.95, fit(['postpone', 'intend', 'and4'], .08, { box: [N.win.x - 80, RAIL - HV, R('win'), RAIL + 30], zm: 1.01 }));
  K(24.55, fit(['win', 'intend', 'to6'], .14, { box: [N.win.x - 80, RAIL - HV - 40, R('win'), RAIL + 220] }));
  K(25.30, fit(['win', 'others', 'too'], .16, { box: [N.win.x - 80, RAIL - HV - 60, R('intend'), RAIL + 220] }));
  K(26.30, fit(['win', 'others', 'too'], .2, { box: [N.win.x - 80, RAIL - HV - 260, R('intend'), RAIL + 220], zm: .92 }));
  K(27.20, { cx: 4400, cy: 1500, z: .5, r: 0 });
  K(28.15, { cx: WORLD.w / 2, cy: WORLD.h / 2, z: SW / WORLD.w, r: 0 });
  K(29.25, { cx: WORLD.w / 2, cy: WORLD.h / 2 - 8, z: SW / WORLD.w * 1.008, r: 0 });
  K(30.00, { cx: WORLD.w / 2, cy: WORLD.h / 2 - 10, z: SW / WORLD.w * 1.012, r: 0 });
  KEYS.sort((a, b) => a.t - b.t);
}
function camAt(t) {
  let a = KEYS[0], b = KEYS[KEYS.length - 1];
  if (t <= a.t) return { ...a };
  for (let i = 1; i < KEYS.length; i++) if (t <= KEYS[i].t) { a = KEYS[i - 1]; b = KEYS[i]; break; }
  if (t >= b.t) return { ...b };
  const p = (t - a.t) / (b.t - a.t);
  const q = eIO(p), qr = q;
  const cam = {
    cx: lerp(a.cx, b.cx, q), cy: lerp(a.cy, b.cy, q),
    z: Math.exp(lerp(Math.log(a.z), Math.log(b.z), q)), r: lerp(a.r, b.r, qr)
  };
  // follow the persistent vehicle through the ascent
  const fw = eIO(prog(t, 26.1, 26.62)) * (1 - eIO(prog(t, 27.2, 28.1)));
  if (fw > 0) {
    const v = vehiclePose(t);
    const vc = { x: v.x + Math.sin(v.r) * HV * .5 * v.s, y: v.y - Math.cos(v.r) * HV * .5 * v.s };
    cam.cx = lerp(cam.cx, vc.x, fw * .95); cam.cy = lerp(cam.cy, vc.y, fw * .95);
  }
  return cam;
}
function applyCam(c, cam) {
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.translate(SW / 2, SH / 2); c.rotate(cam.r); c.scale(cam.z, cam.z); c.translate(-cam.cx, -cam.cy);
}
function viewBox(cam) {
  const hw = SW / 2 / cam.z * 1.5, hh = SH / 2 / cam.z * 1.5;
  return { x0: cam.cx - hw, x1: cam.cx + hw, y0: cam.cy - hh, y1: cam.cy + hh };
}
function worldToScreen(cam, x, y) {
  const dx = (x - cam.cx) * cam.z, dy = (y - cam.cy) * cam.z;
  const cr = Math.cos(cam.r), sr = Math.sin(cam.r);
  return [SW / 2 + dx * cr - dy * sr, SH / 2 + dx * sr + dy * cr];
}

// ───────────────────────── frame ─────────────────────────
const PANEL_WORDS = new Set(['to3', 'organize', 'and2', 'measure', 'the3', 'best', 'of', 'our', 'energies', 'and3', 'skills']);
function render(t) {
  if (t >= DUR - 1e-9) t = 0;
  const c = ctx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalAlpha = 1;
  c.fillStyle = COL.black; c.fillRect(0, 0, SW, SH);
  if (t < .05) return;
  const cam = camAt(t);
  // the ink surface is discovered through a narrow opening
  const open = t < .9 ? eIO(prog(t, .05, .35)) * .06 + eIO(prog(t, .35, .85)) * .94 : 1;
  const sy = worldToScreen(cam, 0, N.choose.y + 22)[1];
  c.save();
  if (open < 1) { const hh = open * SH; c.beginPath(); c.rect(0, sy - hh / 2 - 30 * (1 - open), SW, hh + 60 * (1 - open)); c.clip(); }
  c.fillStyle = COL.ink; c.fillRect(0, 0, SW, SH);
  applyCam(c, cam);
  drawSpecks(c, viewBox(cam));
  drawPanel(c, t, cam);
  drawAxis(c, t);
  drawSlots(c, t);
  drawRail(c, t);
  drawEnergy(c, t);
  drawOpeningLines(c, t);
  drawEasyGuide(c, t);
  drawBuffer(c, t);
  // text
  for (const n of ORDER) {
    if (n.id === 'moon') continue;
    if (PANEL_WORDS.has(n.id) && t < 10.62) continue;
    drawWord(c, n, t);
  }
  drawMoon(c, t);
  drawWinOutline(c, t);
  // mechanisms
  drawMeasure(c, t);
  drawRegistration(c, t);
  drawGate(c, t);
  drawCradle(c, t);
  drawLatch(c, t);
  drawHoldBar(c, t);
  for (const a of ANNO) {
    const al = a.text === 'HOLD' ? eOut(prog(t, 20.3, 20.6)) * (1 - prog(t, 21.95, 22.2))
      : a.text === 'ASSEMBLY AXIS' ? eOut(prog(t, 10.7, 11.0))
      : eOut(prog(t, 16.6, 17.0));
    if (al > 0) drawStaticText(c, a, al);
  }
  drawRoute(c, t);
  drawArrival(c, t);
  // vehicle: selective deterministic motion blur on the ascent only
  if (t > 25.0 && t < 28.0) {
    for (const [k, al] of [[3, .07], [2, .12], [1, .2]]) drawVehicle(c, t - k * FR, al);
  }
  drawIgnition(c, t);
  drawVehicle(c, t);
  // attribution in reserved negative space
  const at = eOut(prog(t, 28.25, 28.75));
  if (at > 0) STATIC.forEach((n, i) => drawStaticText(c, n, eOut(prog(t, 28.25 + i * .1, 28.75 + i * .1))));
  c.restore();
  // graphic closure: a dark circular mask expanding from the lunar disc
  if (t >= 29.25) {
    const d = N.moon.disc;
    const [mx, my] = worldToScreen(cam, d.x, d.y);
    const far = Math.max(Math.hypot(mx, my), Math.hypot(SW - mx, my), Math.hypot(mx, SH - my), Math.hypot(SW - mx, SH - my));
    const r = far * eIn(prog(t, 29.25, 29.9));
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = COL.black;
    if (t >= 29.9) c.fillRect(0, 0, SW, SH);
    else { c.beginPath(); c.arc(mx, my, r, 0, Math.PI * 2); c.fill(); }
  }
}

// ───────────────────────── public API, playback, debug ─────────────────────────
let playing = true, t0 = null, tPaused = 0, isReady = false;
const params = new URLSearchParams(location.search);
const capture = params.has('capture');
if (capture) document.body.classList.add('capture');
const ppBtn = document.getElementById('pp'), scrub = document.getElementById('scrub'), tc = document.getElementById('tc');
function show(t) { scrub.value = String(Math.round(t * FPS) % NF); tc.textContent = t.toFixed(2) + ' s'; }
function seek(t) {
  if (!isReady) return;
  playing = false; ppBtn.textContent = 'Play';
  t = clamp(t, 0, DUR); tPaused = t;
  render(t); show(t);
}
function renderFrame(n) { seek(clamp(Math.round(n), 0, NF) / FPS); }
function tick(now) {
  if (playing && isReady) {
    if (t0 === null) t0 = now - tPaused * 1000;
    const t = ((now - t0) / 1000) % DUR;
    render(t); show(t); tPaused = t;
  }
  requestAnimationFrame(tick);
}
ppBtn.onclick = () => { if (playing) { playing = false; ppBtn.textContent = 'Play'; } else { playing = true; t0 = null; ppBtn.textContent = 'Pause'; } };
scrub.oninput = () => seek(+scrub.value / FPS);

const DEBUG_TIMES = [0.00, 1.35, 3.35, 7.40, 9.05, 11.90, 13.10, 15.50, 19.90, 22.35, 24.80, 26.20, 27.80, 28.75];
function contactSheet(times = DEBUG_TIMES, cols = 4, tw = 480) {
  const th = tw * 9 / 16, rows = Math.ceil(times.length / cols);
  const out = document.createElement('canvas'); out.width = cols * tw; out.height = rows * (th + 26);
  const o = out.getContext('2d'); o.fillStyle = '#0b0f14'; o.fillRect(0, 0, out.width, out.height);
  const keep = tPaused, wasPlaying = playing;
  times.forEach((t, i) => {
    render(t);
    const x = (i % cols) * tw, y = Math.floor(i / cols) * (th + 26);
    o.drawImage(cv, x, y, tw, th);
    o.fillStyle = '#c9c2b2'; o.font = '14px ui-monospace,monospace'; o.fillText(t.toFixed(2) + ' s', x + 8, y + th + 18);
  });
  render(keep); playing = wasPlaying;
  return out;
}
function cueTable() {
  return '<table><tr><th>#</th><th>id</th><th>word</th><th>start</th><th>t</th><th>end</th><th>motion</th></tr>' +
    window.cues.map((q, i) => `<tr><td>${i + 1}</td><td>${q.id}</td><td>${q.word}</td><td>${q.start.toFixed(3)}</td><td>${q.t.toFixed(3)}</td><td>${q.end.toFixed(3)}</td><td>${N[q.id].motion}</td></tr>`).join('') + '</table>';
}
document.getElementById('dbgBtn').onclick = () => {
  const dbg = document.getElementById('debug');
  dbg.hidden = !dbg.hidden;
  if (!dbg.hidden) {
    dbg.innerHTML = '<p>Contact sheet (rendered with seek; outside the captured frame)</p>';
    dbg.appendChild(contactSheet());
    dbg.insertAdjacentHTML('beforeend', '<p>Spoken cues (authored 30-second interpretation; not synchronised to the 1962 recording)</p>' + cueTable());
  }
};

window.duration = DUR;
window.fps = FPS;
window.seek = seek;
window.renderFrame = renderFrame;
window.cues = [];
window.ready = new Promise(resolve => {
  setTimeout(() => {
    loadFonts();
    layout();
    setupComponents();
    buildRoute();
    buildTexture();
    buildCamera();
    window.cues = ORDER.map(n => ({ id: n.id, word: n.text.replace(/[,.]$/, '').toLowerCase(), start: +n.start.toFixed(4), t: n.t, end: n.end }));
    window.debug = {
      contactSheet, times: DEBUG_TIMES, nodes: N, route: () => ROUTE, vehiclePose, components: COMPONENTS.map(c => ({ id: c.id, initial: c.initial, assembled: c.assembled, inspected: c.inspected, launch: 'route' })),
      hashFrame: t => { render(t); const d = ctx.getImageData(0, 0, SW, SH).data; let h = 2166136261; for (let i = 0; i < d.length; i += 7) { h ^= d[i]; h = Math.imul(h, 16777619); } return h >>> 0; },
      isBlack: t => { render(t); const d = ctx.getImageData(0, 0, SW, SH).data; for (let i = 0; i < d.length; i += 4) if (d[i] | d[i + 1] | d[i + 2]) return false; return true; }
    };
    isReady = true;
    window.__ready = true;
    if (capture) { playing = false; render(0); } else requestAnimationFrame(tick);
    resolve(true);
  }, 0);
});
})();
