<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>He Has</title>
<style>
@font-face{font-family:"Barlow Condensed";font-style:italic;font-weight:800;src:url(fonts/barlowc-800i.ttf) format("truetype")}
@font-face{font-family:"Montserrat";font-style:normal;font-weight:600;src:url(fonts/montserrat-600.ttf) format("truetype")}
@font-face{font-family:"Montserrat";font-style:normal;font-weight:800;src:url(fonts/montserrat-800.ttf) format("truetype")}
@font-face{font-family:"Allerta Stencil";font-style:normal;font-weight:400;src:url(fonts/allerta-stencil.ttf) format("truetype")}
@font-face{font-family:"Libre Caslon Text";font-style:normal;font-weight:700;src:url(fonts/libre-caslon-700.ttf) format("truetype")}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{position:absolute;inset:0;margin:auto;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;display:block}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
(() => {
'use strict';
const SW = 1920, SH = 1080, FPS = 60, DUR = 30, FR = 1 / FPS;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  night: '#1A1918', vig: '#050505', bone: '#EDE7DA', parch: '#F2ECDF', ink: '#15130F',
  red: '#B3202A', navy: '#1C2C5B', echo: '#77736B'
};
const F = {
  refrain: { fam: 'Barlow Condensed', w: 800, s: 'italic' },
  body:    { fam: 'Montserrat', w: 800, s: 'normal' },
  small:   { fam: 'Montserrat', w: 600, s: 'normal' },
  mil:     { fam: 'Allerta Stencil', w: 400, s: 'normal' },
  doc:     { fam: 'Libre Caslon Text', w: 700, s: 'normal' }
};
const fontStr = (fk, px) => `${F[fk].s} ${F[fk].w} ${px}px "${F[fk].fam}"`;
const CAP = {};

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, p) => a + (b - a) * p;
const eIO = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eOut = p => 1 - Math.pow(1 - p, 3);
const eIn = p => p * p * p;
const eQ = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
const eBackOut = (p, s = 1.70158) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);
// in-out with a small overshoot on arrival (~6%)
const eIOover = p => {
  const a = eIO(clamp(p / .82));
  if (p < .82) return a * 1.06;
  const q = (p - .82) / .18;
  return 1.06 - .06 * eIO(q);
};
const bounce1 = p => p < .72 ? Math.pow(p / .72, 2) : 1 - .1 * Math.sin(Math.PI * (p - .72) / .28);
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---------- script ----------
const MEAS = 1000;
const w = (text, t, e, o = {}) => ({ k: 'w', text, t, e, ...o });
const v = (text, t, o = {}) => ({ k: 'v', text, t, ...o });
const s = (rows, o = {}) => ({ k: 's', rows, ...o });
const L = (items, o = {}) => ({ items, ...o });

const NIGHT_A = [
  L([w('HE HAS', 1.30, 'fly', { f: 'refrain' })]),
  L([w('KEPT', 1.62, 'slide'), v('AMONG', 1.85), w('US,', 2.05, 'slam'), s([['IN TIMES', 2.45], ['OF PEACE,', 2.75]])]),
  L([w('STANDING', 3.55, 'standup', { f: 'mil' })]),
  L([w('ARMIES', 3.95, 'slam', { f: 'mil', col: 'red', camDy: .75, camZ: .8, pict: { i: 0, type: 'musketA' } })], { tilt: -10, gapAfter: .9 })
];
const NIGHT_A2 = [
  L([s([['WITHOUT', 4.95, { ct: 5.30 }], ['THE', 5.15, { nocam: 1 }]]),
     w('CONSENT', 5.60, 'slide', { f: 'doc', pict: { i: 1, type: 'sealO', inner: 'OF OUR', innerT: 5.95, slashT: 6.05 } })]),
  L([w('LEGISLATURES.', 6.75, 'slide')])
];
const NIGHT_B = [
  L([w('HE HAS', 7.95, 'slam', { f: 'refrain', ct: 7.58 })]),
  L([w('PLUNDERED', 8.45, 'slide'), s([['OUR', 8.70]]), w('SEAS,', 9.00, 'drop', { fx: 'waves', camDy: .9, camZ: .8 })], { gapAfter: .9 }),
  L([w('RAVAGED', 9.60, 'slam'), s([['OUR', 9.85]]), w('COASTS,', 10.15, 'slam')]),
  L([w('BURNT', 10.95, 'slam', { col: 'red', fx: 'flames' }), s([['OUR', 11.30]]), w('TOWNS,', 11.65, 'drop', { fx: 'skyline', camDy: .3 })], { gapBefore: .5, gapAfter: .55 }),
  L([v('AND', 12.05), w('DESTROYED', 12.45, 'knocked'), v('THE', 12.80), w('LIVES', 13.05, 'drop'), s([['OF', 13.30], ['OUR', 13.45]])]),
  L([w('PEOPLE.', 13.95, 'drop', { pict: { i: 2, type: 'peopleO' }, fx: 'people', camDy: .5, camZ: .9 })], { gapAfter: .6 })
];
const PARCH = [
  L([v('THESE', 15.30, { ct: 15.45 }), w('UNITED', 15.90, 'slam', { col: 'navy' }), w('COLONIES', 16.70, 'slide', { pict: { i: 1, type: 'starsO' } }), v('ARE,', 17.30)]),
  L([s([['AND', 17.70], ['OF', 17.85]]), w('RIGHT', 18.15, 'slam', { f: 'doc' }), s([['OUGHT', 18.55], ['TO BE', 18.80]])]),
  L([w('FREE', 19.20, 'slam', { fx: 'shackle' }), v('AND', 19.60)]),
  L([w('INDEPENDENT', 20.25, 'ghost', { col: 'navy', pict: { i: 0, type: 'hallI' } }), w('STATES;', 21.05, 'slide')]),
  L([w('WE', 21.60, 'slam'), v('MUTUALLY', 21.90), w('PLEDGE', 22.45, 'slam', { fx: 'seal' }), s([['TO EACH', 23.10], ['OTHER', 23.30]])]),
  L([s([['OUR', 23.50]]), w('LIVES,', 23.90, 'drop'), s([['OUR', 24.30]]), w('FORTUNES', 24.60, 'slide', { pict: { i: 1, type: 'coinO' } })]),
  L([s([['AND OUR', 25.15], ['SACRED', 25.40]]), w('HONOR.', 25.90, 'wipe', { f: 'doc', fx: 'swash', camDy: .25 })], { gapAfter: .5 })
];

// ---------- layout ----------
const blocks = [];
const tokens = [];
function measure(fk, cap, str) {
  ctx.font = fontStr(fk, cap / CAP[fk]);
  return ctx.measureText(str).width;
}
function letterXs(fk, cap, str) {
  ctx.font = fontStr(fk, cap / CAP[fk]);
  const xs = [];
  for (let i = 0; i <= str.length; i++) xs.push(ctx.measureText(str.slice(0, i)).width);
  return xs;
}
function makeToken(src, fk, cap, x, y, rot, line, block) {
  const xs = letterXs(fk, cap, src.text);
  const tk = {
    text: src.text, t: src.t, e: src.e || 'tick', f: fk, cap, x, y, rot,
    col: src.col, pict: src.pict, fx: src.fx, ct: src.ct, nocam: src.nocam, camDy: src.camDy || 0, camZ: src.camZ || 1,
    xs, w: xs[xs.length - 1], line, block, world: block.world
  };
  tokens.push(tk);
  return tk;
}
function layoutBlock(lines, world) {
  const b = { lines: [], tokens: [], world, x: 0, y: 0, rot: 0, sc: 1, h: 0 };
  let y = 0, prevH = 0;
  lines.forEach((ln, li) => {
    // measure in cap units (cap = 100 then normalise)
    const parts = ln.items.map(it => {
      if (it.k === 'w') return { it, wd: measure(it.f || 'body', 100, it.text) / 100, gapL: .2 };
      if (it.k === 'v') {
        const len = measure('small', 100, it.text) / 100;
        const vc = Math.min(.3, .96 / len);
        return { it, vc, wd: vc * 1.05, gapL: .13 };
      }
      const n = it.rows.length;
      const rc = n === 1 ? .34 : (1 - .22 * (n - 1)) / n;
      const wd = Math.max(...it.rows.map(r => measure('small', 100, r[0]) / 100 * rc));
      return { it, rc, wd, gapL: .13 };
    });
    let nat = 0;
    parts.forEach((p, i) => { nat += p.wd + (i ? Math.max(p.gapL, parts[i - 1].gapL) : 0); });
    const S = MEAS / nat;
    const gap = li === 0 ? 0 : (.17 * Math.min(prevH, S)) + (ln.gapBefore || 0) * Math.min(prevH, S) + (lines[li - 1].gapAfter || 0) * prevH;
    y += gap;
    const line = { top: y, h: S, tilt: ln.tilt || 0, toks: [] };
    let x = 0;
    parts.forEach((p, i) => {
      if (i) x += Math.max(p.gapL, parts[i - 1].gapL) * S;
      const base = y + S;
      if (p.it.k === 'w') {
        line.toks.push(makeToken(p.it, p.it.f || 'body', S, x, base, 0, line, b));
      } else if (p.it.k === 'v') {
        const tk = makeToken(p.it, 'small', p.vc * S, x + p.vc * S, base, -Math.PI / 2, line, b);
        tk.vbox = { x0: x, x1: x + p.vc * S };
        line.toks.push(tk);
      } else {
        const n = p.it.rows.length;
        p.it.rows.forEach((r, j) => {
          const rowBase = n === 1 ? base : y + ((j + 1) * p.rc + j * .22) * S;
          const tk = makeToken({ text: r[0], t: r[1], e: 'tick', ...(r[2] || {}) }, 'small', p.rc * S, x, rowBase, 0, line, b);
          line.toks.push(tk);
        });
      }
      x += p.wd * S;
    });
    b.lines.push(line);
    y += S; prevH = S;
  });
  b.h = y;
  b.tokens = tokens.filter(t => t.block === b);
  blocks.push(b);
  return b;
}
// block-local -> world
function toWorld(b, x, y) {
  const c = Math.cos(b.rot), s2 = Math.sin(b.rot);
  return [b.x + (x * c - y * s2) * b.sc, b.y + (x * s2 + y * c) * b.sc];
}
// token-local (baseline origin) -> block-local
function tokLocal(tk, x, y) {
  if (!tk.rot) return [tk.x + x, tk.y + y];
  // rotate -90: (x,y) -> (y, -x)
  return [tk.x + y, tk.y - x];
}

let BA, BA2, BB, BP, OC; // blocks and PEOPLE-O geometry (world)
let actors = [], camKeys = [], slamTimes = [];

function build() {
  for (const k in F) { ctx.font = fontStr(k, 100); CAP[k] = ctx.measureText('H').actualBoundingBoxAscent / 100; }
  BA = layoutBlock(NIGHT_A, 'night');
  BA2 = layoutBlock(NIGHT_A2, 'night');
  BB = layoutBlock(NIGHT_B, 'night');
  BP = layoutBlock(PARCH, 'parch');
  // A2 rotated 90deg clockwise, below block A, its first line near A's right edge
  const armCap = BA.lines[3].h;
  BA2.rot = Math.PI / 2; BA2.x = MEAS + 40; BA2.y = BA.h + armCap * 1.5;
  // B upright, below A2
  BB.x = -BA2.h - 120; BB.y = BA2.y + MEAS + 160;
  // PEOPLE O
  const ptk = BB.tokens.find(t => t.text === 'PEOPLE.');
  const i = 2, cx = (ptk.xs[i] + ptk.xs[i + 1]) / 2, cap = ptk.cap;
  const [wx, wy] = toWorld(BB, ptk.x + cx, ptk.y - cap / 2);
  OC = { x: wx, y: wy, R: .56 * cap, r: .56 * cap - .2 * cap };
  // parchment block inside the counter
  const sc = (.93 * OC.r) / Math.hypot(MEAS / 2, BP.h / 2);
  BP.sc = sc; BP.x = OC.x - MEAS / 2 * sc; BP.y = OC.y - BP.h / 2 * sc;
  buildActors();
  buildCamera();
  tokens.forEach(t => { if (t.e === 'slam' || t.e === 'knocked') slamTimes.push(t.t); });
}

// ---------- camera ----------
function frameFor(tk, zoomMul = 1) {
  const b = tk.block, ln = tk.line;
  const xEnd = tk.vbox ? tk.vbox.x1 : tk.x + tk.w;
  const fw = Math.max(xEnd * 1.12, MEAS * .58, (tk.rot ? 0 : tk.w * 1.5));
  let cxL = xEnd - fw * .44;
  cxL = Math.max(cxL, fw * .42 - 20);
  const cyL = ln.top + ln.h * .5 - ln.h * .28 + tk.camDy * ln.h;
  const fh = ln.h * 2.6;
  const [cx, cy] = toWorld(b, cxL, cyL);
  const zoom = Math.min(SW / (fw * b.sc), SH / (fh * b.sc)) * zoomMul * tk.camZ;
  return { cx, cy, zoom, rot: -b.rot + (ln.tilt || 0) * Math.PI / 180 };
}
function key(t, st, ease = 'io') { camKeys.push({ t, ...st, ease }); }
function buildCamera() {
  const byText = (b, txt) => b.tokens.find(t => t.text === txt);
  const auto = tokens.filter(t => !t.nocam).sort((a, b) => (a.ct ?? a.t) - (b.ct ?? b.t));
  const he = byText(BA, 'HE HAS');
  key(0, frameFor(he, .78));
  for (const tk of auto) {
    const kt = tk.ct ?? tk.t;
    const st = frameFor(tk);
    let ease = 'io';
    if (tk.text === 'WITHOUT') ease = 'over';
    if (tk === byText(BB, 'HE HAS')) ease = 'whip';
    if (tk.block === BP && tk.text === 'THESE') ease = 'out';
    key(kt, st, ease);
  }
  const arm = frameFor(byText(BA, 'ARMIES'));
  key(4.55, { ...arm, zoom: arm.zoom * .95, cx: arm.cx - 80 });
  const leg = frameFor(byText(BA2, 'LEGISLATURES.'));
  key(7.30, { ...leg, zoom: leg.zoom * 1.04 });
  const peo = frameFor(byText(BB, 'PEOPLE.'));
  key(14.40, { ...peo, zoom: peo.zoom * 1.05 });
  key(14.72, { cx: OC.x, cy: OC.y, zoom: 420 / OC.R, rot: 0 });
  key(15.00, { cx: OC.x, cy: OC.y, zoom: 1250 / OC.r, rot: 0 }, 'in');
  const hon = frameFor(byText(BP, 'HONOR.'));
  key(26.60, { ...hon, zoom: hon.zoom * 1.04 });
  key(28.20, { cx: OC.x, cy: OC.y, zoom: 430 / OC.R, rot: 0 });
  key(29.20, { cx: OC.x, cy: OC.y, zoom: 440 / OC.R, rot: 0 });
  key(30.00, { cx: OC.x, cy: OC.y, zoom: 470 / OC.R, rot: 0 });
  camKeys.sort((a, b) => a.t - b.t);
}
function camAt(t) {
  const K = camKeys;
  if (t <= K[0].t) return { ...K[0] };
  for (let i = 1; i < K.length; i++) {
    if (t <= K[i].t) {
      const a = K[i - 1], b = K[i];
      const p = (t - a.t) / Math.max(1e-6, b.t - a.t);
      const ez = { io: eIO, over: eIO, whip: eQ, in: eIn, out: eOut }[b.ease] || eIO;
      const q = ez(p);
      const qr = b.ease === 'over' ? eIOover(p) : q;
      return {
        cx: lerp(a.cx, b.cx, q), cy: lerp(a.cy, b.cy, q),
        zoom: Math.exp(lerp(Math.log(a.zoom), Math.log(b.zoom), q)),
        rot: lerp(a.rot, b.rot, qr)
      };
    }
  }
  return { ...K[K.length - 1] };
}

// ---------- actors (silhouettes & moving shapes) ----------
function buildActors() {
  const tok = (b, txt) => b.tokens.find(t => t.text === txt);
  // Redcoats: march right-to-left below ARMIES
  const arm = tok(BA, 'ARMIES');
  actors.push({ b: BA, t0: 3.0, t1: 6.2, echo: true, draw: (c, t) => drawRedcoats(c, t, arm) });
  // Ship behind SEAS
  const seas = tok(BB, 'SEAS,');
  actors.push({ b: BB, t0: 8.15, t1: 10.0, echo: true, draw: (c, t) => drawShip(c, t, seas) });
  // Coastline behind COASTS
  const coasts = tok(BB, 'COASTS,');
  actors.push({ b: BB, t0: 9.35, t1: 11.35, back: true, draw: (c, t) => drawCoast(c, t, coasts) });
  // Flames on BURNT (drawn behind the word)
  const burnt = tok(BB, 'BURNT');
  actors.push({ b: BB, t0: 10.90, t1: 99, back: true, draw: (c, t) => drawFlames(c, t, burnt) });
  // Skyline under TOWNS
  const towns = tok(BB, 'TOWNS,');
  actors.push({ b: BB, t0: 11.45, t1: 99, draw: (c, t) => drawSkyline(c, t, towns) });
  // People under PEOPLE
  const peo = tok(BB, 'PEOPLE.');
  actors.push({ b: BB, t0: 13.95, t1: 99, draw: (c, t) => drawPeople(c, t, peo) });
  // Stars into COLONIES
  const col = tok(BP, 'COLONIES');
  const R = rng(1776);
  const starsFrom = [];
  for (let i = 0; i < 13; i++) starsFrom.push([R() * MEAS, -R() * 260 - 40 + R() * 420, R() * 6.28]);
  actors.push({ b: BP, t0: 15.55, t1: 17.40, draw: (c, t) => drawStarsFlying(c, t, col, starsFrom) });
  // Shackle on FREE
  const free = tok(BP, 'FREE');
  actors.push({ b: BP, t0: 19.10, t1: 20.20, echo: true, draw: (c, t) => drawShackle(c, t, free) });
  // Seal bloom behind PLEDGE
  const pl = tok(BP, 'PLEDGE');
  actors.push({ b: BP, t0: 22.45, t1: 23.10, back: true, draw: (c, t) => drawSealBloom(c, t, pl) });
  // Swash under HONOR
  const hon = tok(BP, 'HONOR.');
  actors.push({ b: BP, t0: 26.00, t1: 99, draw: (c, t) => drawSwash(c, t, hon) });
}

function withTok(c, tk, fn) {
  c.save();
  c.translate(tk.x, tk.y);
  if (tk.rot) c.rotate(tk.rot);
  fn();
  c.restore();
}

// Redcoat soldier, facing left, feet at (0,0), height h
function soldier(c, h, pose, fill) {
  c.fillStyle = fill; c.strokeStyle = fill;
  const leg = (x0, x1) => { c.beginPath(); c.moveTo(x0 - .035 * h, -.36 * h); c.lineTo(x0 + .035 * h, -.36 * h); c.lineTo(x1 + .03 * h, 0); c.lineTo(x1 - .04 * h, 0); c.closePath(); c.fill(); c.fillRect(x1 - .075 * h, -.025 * h, .08 * h, .025 * h); };
  if (pose) { leg(-.02 * h, -.13 * h); leg(.03 * h, .1 * h); } else { leg(-.01 * h, -.04 * h); leg(.02 * h, .04 * h); }
  // coat with tails
  c.beginPath();
  c.moveTo(-.09 * h, -.66 * h); c.lineTo(.09 * h, -.66 * h);
  c.lineTo(.12 * h, -.3 * h); c.lineTo(.03 * h, -.34 * h); c.lineTo(-.03 * h, -.3 * h); c.lineTo(-.12 * h, -.3 * h);
  c.closePath(); c.fill();
  // head + tricorn
  c.beginPath(); c.arc(0, -.73 * h, .062 * h, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.moveTo(-.13 * h, -.775 * h); c.quadraticCurveTo(0, -.9 * h, .13 * h, -.775 * h); c.lineTo(.06 * h, -.79 * h); c.lineTo(0, -.83 * h); c.lineTo(-.06 * h, -.79 * h); c.closePath(); c.fill();
  // arm swing
  c.lineWidth = .05 * h; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-.03 * h, -.62 * h); c.lineTo((pose ? -.1 : .06) * h, -.42 * h); c.stroke();
  // shouldered musket (right shoulder, angled back)
  c.save(); c.translate(.07 * h, -.6 * h); c.rotate(.42);
  c.fillRect(-.016 * h, -.5 * h, .032 * h, .62 * h);       // barrel
  c.fillRect(-.03 * h, .02 * h, .06 * h, .2 * h);          // stock
  c.beginPath(); c.moveTo(-.008 * h, -.5 * h); c.lineTo(0, -.66 * h); c.lineTo(.008 * h, -.5 * h); c.fill(); // bayonet
  c.restore();
  c.lineWidth = .045 * h; c.beginPath(); c.moveTo(.06 * h, -.62 * h); c.lineTo(.12 * h, -.48 * h); c.stroke();
}
function drawRedcoats(c, t, arm) {
  const h = arm.cap * 1.15, ground = arm.y + arm.cap * 1.42;
  const speed = 420; // block units / s
  const x0 = MEAS + 100 - (t - 3.0) * speed;
  const pose = Math.floor(t * 10) % 2;
  for (let i = 0; i < 5; i++) {
    c.save(); c.translate(x0 + i * .48 * h, ground);
    soldier(c, h, (pose + i) % 2, c.__fill || C.red);
    c.restore();
  }
}
function drawShip(c, t, seas) {
  const h = seas.cap * 1.3;
  const x = -250 + (t - 8.15) * 880, y = seas.y + seas.cap * 1.6;
  c.save(); c.translate(x, y); c.rotate(Math.sin(t * 5) * .035);
  c.fillStyle = c.__fill || C.bone;
  // hull
  c.beginPath(); c.moveTo(-.62 * h, -.2 * h); c.lineTo(.5 * h, -.2 * h); c.lineTo(.7 * h, -.3 * h); c.lineTo(.55 * h, 0); c.lineTo(-.5 * h, 0); c.lineTo(-.66 * h, -.28 * h); c.closePath(); c.fill();
  // masts & square sails
  const masts = [[-.35, .78], [.02, .95], [.36, .82]];
  for (const [mx, mh] of masts) {
    c.fillRect(mx * h - .012 * h, -mh * h - .2 * h, .024 * h, mh * h);
    for (let k = 0; k < 3; k++) {
      const top = -.2 * h - mh * h * (.92 - k * .29), bot = top + mh * h * .24, wd = (.17 - k * -.02) * h * (1 - k * .12);
      c.beginPath(); c.moveTo(mx * h - wd * .82, top); c.lineTo(mx * h + wd * .82, top);
      c.quadraticCurveTo(mx * h + wd * 1.08, (top + bot) / 2, mx * h + wd, bot);

  if (tk.e === 'standup') return tk.t - (8 + 3 * (tk.text.length - 1)) * FR;
  return tk.t - (D[tk.e] || 0) * FR;
}
function drawLetters(c, tk, t, fill, perLetter) {
  c.font = fontStr(tk.f, tk.cap / CAP[tk.f]);
  c.fillStyle = fill;
  for (let i = 0; i < tk.text.length; i++) {
    const ch = tk.text[i];
    if (ch === ' ') continue;
    let dx = 0, dy = 0, rot = 0, sx = 1, sy = 1, al = 1;
    if (perLetter) { const r = perLetter(i); if (!r) continue; ({ dx = 0, dy = 0, rot = 0, sx = 1, sy = 1, al = 1 } = r); }
    const x0 = tk.xs[i], cxl = (tk.xs[i] + tk.xs[i + 1]) / 2;
    c.save();
    c.translate(cxl + dx, dy); c.rotate(rot); c.scale(sx, sy);
    if (al !== 1) c.globalAlpha *= al;
    if (tk.pict && tk.pict.i === i) { c.translate(-cxl, 0); drawPict(c, tk, i, t, fill); }
    else c.fillText(ch, x0 - cxl, 0);
    c.restore();
  }
}
const KNOCK = {};
function knockFor(tk, i) {
  const k = tk.text + i;
  if (!KNOCK[k]) { const R = rng(i * 97 + 13); KNOCK[k] = { dx: (R() - .5) * 10 * tk.cap / 90, dy: (R() - .5) * 10 * tk.cap / 90, rot: (R() - .5) * .17 }; }
  return KNOCK[k];
}
const FLY = {};
function flyFor(i) {
  if (!FLY[i]) { const R = rng(i * 131 + 7); FLY[i] = { dx: (R() - .5) * 1300, dy: (R() - .5) * 900 - 200, rot: (R() - .5) * 3, sc: .3 + R() * 2.2 }; }
  return FLY[i];
}
function drawToken(c, tk, t, opts = {}) {
  if (t < tokStart(tk)) return;
  const fill = opts.fill || tokColor(tk);
  const night = tk.world === 'night';
  c.save();
  c.translate(tk.x, tk.y);
  if (tk.rot) c.rotate(tk.rot);
  if (night && !opts.fill) {
    c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 4; c.shadowOffsetX = 3; c.shadowOffsetY = 3;
  }
  const W = tk.w, cap = tk.cap;
  const p = clamp((t - tokStart(tk)) / Math.max(FR, tk.t - tokStart(tk)));
  let per = null;
  const fx = tk.fx;
  if (fx === 'waves') per = i => ({ dy: Math.sin(t * 5.2 + i * 1.1) * cap * .06 });
  switch (tk.e) {
    case 'slam': case 'knocked': {
      const sc = 1.4 - .4 * eOut(p);
      c.translate(W / 2, -cap / 2); c.scale(sc, sc); c.translate(-W / 2, cap / 2);
      c.globalAlpha *= clamp(p * 2.5);
      if (tk.e === 'knocked') {
        const q = eOut(clamp((t - tk.t) / (4 / 60)));
        per = i => { const k = knockFor(tk, i); return { dx: k.dx * q, dy: k.dy * q, rot: k.rot * q }; };
      }
      break;
    }
    case 'slide': {
      const dist = Math.max(W * .9, 380);
      if (p < 1 && !opts.ghost) {
        for (const [lag, al] of [[.2, .1], [.13, .18], [.06, .3]]) {
          const pp = clamp(p - lag);
          c.save(); c.globalAlpha *= al; c.translate((1 - eOut(pp)) * dist, 0);
          drawLetters(c, tk, t, fill, per); c.restore();
        }
      }
      c.translate((1 - eOut(p)) * dist, 0);
      break;
    }
    case 'drop': {
      c.translate(0, -(1 - bounce1(p)) * cap * 1.8);
      c.globalAlpha *= clamp(p * 3);
      break;
    }
    case 'ghost': {
      const sc = lerp(3, 1, eOut(p));
      c.translate(W / 2, -cap / 2); c.scale(sc, sc); c.translate(-W / 2, cap / 2);
      c.globalAlpha *= lerp(.15, 1, eIn(p));
      break;
    }
    case 'standup': {
      per = i => {
        const st = tokStart(tk) + 3 * i * FR;
        const q = clamp((t - st) / (8 * FR));
        if (q <= 0) return null;
        return { sy: Math.max(.02, eBackOut(q, 2.2)) };
      };
      break;
    }
    case 'fly': {
      per = i => {
        const st = tokStart(tk) + i * 3 * FR;
        const q = eOut(clamp((t - st) / ((D.fly - 3 * tk.text.length) * FR)));
        if (q <= 0) return null;
        const f = flyFor(i);
        const sc = lerp(f.sc, 1, q);
        return { dx: f.dx * (1 - q), dy: f.dy * (1 - q), rot: f.rot * (1 - q), sx: sc, sy: sc, al: clamp(q * 2) };
      };
      break;
    }
    case 'wipe': {
      c.beginPath(); c.rect(-cap * .3, -cap * 1.6, (W + cap * .6) * eIO(p), cap * 2.2); c.clip();
      break;
    }
    default: break;
  }
  drawLetters(c, tk, t, fill, per);
  c.restore();
}

// ---------- render ----------
function applyBlock(c, b) {
  c.translate(b.x, b.y); c.rotate(b.rot); c.scale(b.sc, b.sc);
}
function drawActors(c, b, t, back, fillOverride) {
  for (const a of actors) {
    if (a.b !== b || !!a.back !== back || t < a.t0 || t > a.t1) continue;
    if (a.echo && !fillOverride) {
      for (const [k, al] of [[3, .15], [2, .35], [1, .6]]) {
        const te = t - k * 4 * FR;
        if (te < a.t0) continue;
        c.save(); c.globalAlpha *= al; c.__fill = C.echo; a.draw(c, te); c.__fill = null; c.restore();
      }
    }
    c.save(); a.draw(c, t); c.restore();
  }
}
function drawBlock(c, b, t) {
  c.save(); applyBlock(c, b);
  drawActors(c, b, t, true);
  for (const tk of b.tokens) drawToken(c, tk, t);
  drawActors(c, b, t, false);
  c.restore();
}
function camTransform(c, t) {
  const cam = camAt(t);
  // continuous breathing so the camera is never still
  const dr = .6 * Math.PI / 180 * Math.sin(t * .7);
  const dz = 1 + .015 * Math.sin(t * .9 + 1);
  let sx = 0, sy = 0;
  for (const st of slamTimes) {
    const d = t - st;
    if (d >= 0 && d < 2 * FR) { const f = Math.round(d / FR); sx += (f ? -1 : 1) * SH * .015; sy += (f ? 1 : -.6) * SH * .01; }
  }
  // opening tilted plane
  const k = 1 - eIO(clamp((t - .4) / 2.6));
  c.translate(SW / 2 + sx, SH / 2 + sy);
  if (k > 0) { c.rotate(-15 * Math.PI / 180 * k); c.transform(1, 0, -.38 * k, 1 - .3 * k, 0, 0); }
  c.rotate(cam.rot + dr);
  c.scale(cam.zoom * dz, cam.zoom * dz);
  c.translate(-cam.cx, -cam.cy);
}
function background(c) {
  c.setTransform(1, 0, 0, 1, 0, 0);
  const g = c.createRadialGradient(SW / 2, SH / 2, SH * .25, SW / 2, SH / 2, SW * .62);
  g.addColorStop(0, C.night); g.addColorStop(.55, '#151413'); g.addColorStop(1, C.vig);
  c.fillStyle = g; c.fillRect(0, 0, SW, SH);
}
function parchFill(t) {
  return clamp((t - 14.45) / .35);
}
function content(c, t, alpha) {
  c.save();
  c.globalAlpha = alpha;
  camTransform(c, t);
  const base = c.getTransform();
  drawBlock(c, BA, t);
  drawBlock(c, BA2, t);
  drawBlock(c, BB, t);
  // parchment world inside PEOPLE's O
  const pf = parchFill(t);
  if (pf > 0) {
    c.save();
    c.beginPath(); c.arc(OC.x, OC.y, OC.r + .5, 0, Math.PI * 2); c.clip();
    c.globalAlpha = alpha * pf;
    c.fillStyle = C.parch; c.fillRect(OC.x - OC.R, OC.y - OC.R, OC.R * 2, OC.R * 2);
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = 'rgba(21,19,15,.04)';
    for (let y = 0; y < SH; y += 6) c.fillRect(0, y, SW, 1);
    c.setTransform(base);
    c.globalAlpha = alpha;
    drawBlock(c, BP, t);
    c.restore();
  }
  c.restore();
}
const BLUR = [[7.26, 7.62], [14.62, 15.02]];
function render(t) {
  t = ((t % DUR) + DUR) % DUR;
  const c = ctx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalAlpha = 1;
  background(c);
  if (BLUR.some(([a, b]) => t >= a && t <= b)) {
    content(c, t - 2 * FR, .22);
    content(c, t - FR, .35);
  }
  content(c, t, 1);
  c.setTransform(1, 0, 0, 1, 0, 0);
  // caption
  const cp = clamp((t - 28.2) / .5);
  if (cp > 0) {
    c.globalAlpha = .7 * cp;
    c.fillStyle = C.bone; c.font = fontStr('small', 22); c.textAlign = 'center';
    if ('letterSpacing' in c) c.letterSpacing = '6px';
    c.fillText('THE DECLARATION OF INDEPENDENCE  ·  1776', SW / 2, SH - 34);
    if ('letterSpacing' in c) c.letterSpacing = '0px';
    c.textAlign = 'left'; c.globalAlpha = 1;
  }
  // iris close (end) / breathe in (start)
  if (t >= 29.2) {
    const q = eIn(clamp((t - 29.2) / .8));
    const rr = lerp(1150, 0, q);
    c.fillStyle = '#000';
    c.beginPath(); c.rect(0, 0, SW, SH); c.arc(SW / 2, SH / 2, Math.max(0, rr), 0, Math.PI * 2, true); c.fill('evenodd');
    if (q >= 1) c.fillRect(0, 0, SW, SH);
  }
  if (t < .55) {
    c.fillStyle = `rgba(0,0,0,${1 - eIO(t / .55)})`; c.fillRect(0, 0, SW, SH);
  }
}

// ---------- public API ----------
let ready = false, playing = true, t0 = null;
window.duration = DUR;
window.seek = t => { if (ready) render(Math.abs(t - DUR) < 1e-9 ? 0 : t); };
window.render = window.seek;
window.cues = [];
function loop(now) {
  if (playing) {
    if (t0 === null) t0 = now;
    const t = ((now - t0) / 1000) % DUR;
    render(Math.round(t * FPS) / FPS);
  }
  requestAnimationFrame(loop);
}
document.fonts.ready.then(() => Promise.all(Object.values(F).map(f => document.fonts.load(fontStr(Object.keys(F).find(k => F[k] === f), 40))))).then(() => {
  build();
  window.cues = tokens.map(t => ({ word: t.text, t: t.t })).sort((a, b) => a.t - b.t);
  window.cues.push({ word: 'OF OUR', t: 5.95 });
  window.cues.sort((a, b) => a.t - b.t);

  window.__ready = true;
  if (!/[?&]still/.test(location.search)) requestAnimationFrame(loop);
  else render(0);

window.pause = () => { playing = false; };
})();
</script>
